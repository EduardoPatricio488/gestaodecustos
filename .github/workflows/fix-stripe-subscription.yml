name: Fix Stripe subscription details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Stripe subscription fallback and safe Blade access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          php_path = Path('app/Livewire/SubscriptionHub.php')
          php = php_path.read_text()

          old = """            $subscription = null;\n            if ($cashierSub?->stripe_id) {\n                $subscription = $stripe->subscriptions->retrieve($cashierSub->stripe_id, [\n                    'expand' => ['default_payment_method', 'latest_invoice'],\n                ]);\n            }\n"""
          new = """            $subscription = null;\n            if ($cashierSub?->stripe_id) {\n                $subscription = $stripe->subscriptions->retrieve($cashierSub->stripe_id, [\n                    'expand' => ['default_payment_method', 'latest_invoice', 'items.data.price'],\n                ]);\n            }\n\n            // Cashier may not have a local subscription even when Stripe does.\n            // Fall back to Stripe's subscriptions for this customer.\n            if (! $subscription) {\n                $stripeSubscriptions = $stripe->subscriptions->all([\n                    'customer' => $customerId,\n                    'status' => 'all',\n                    'limit' => 100,\n                    'expand' => ['data.default_payment_method', 'data.latest_invoice', 'data.items.data.price'],\n                ])->data ?? [];\n\n                $priority = [\n                    'active' => 1,\n                    'trialing' => 2,\n                    'past_due' => 3,\n                    'unpaid' => 4,\n                    'incomplete' => 5,\n                    'incomplete_expired' => 6,\n                    'canceled' => 7,\n                ];\n\n                usort($stripeSubscriptions, function ($a, $b) use ($priority) {\n                    $aPriority = $priority[$a->status ?? ''] ?? 99;\n                    $bPriority = $priority[$b->status ?? ''] ?? 99;\n\n                    if ($aPriority !== $bPriority) {\n                        return $aPriority <=> $bPriority;\n                    }\n\n                    return ($b->created ?? 0) <=> ($a->created ?? 0);\n                });\n\n                $subscription = $stripeSubscriptions[0] ?? null;\n            }\n"""
          if old not in php:
              raise SystemExit('Expected subscription block not found')
          php = php.replace(old, new, 1)
          php_path.write_text(php)

          blade_path = Path('resources/views/livewire/subscription-hub.blade.php')
          blade = blade_path.read_text()
          replacements = {
              "{{ !empty($stripeSub['cancel_at_period_end']) ? 'No fim do período' : ($stripeSub['cancel_at'] ? $formatStripeDate($stripeSub['cancel_at']) : 'Não agendado') }}": "{{ !empty($stripeSub['cancel_at_period_end']) ? 'No fim do período' : (($stripeSub['cancel_at'] ?? null) ? $formatStripeDate($stripeSub['cancel_at']) : 'Não agendado') }}",
              "{{ $stripeSub['status_label'] ?? 'Não encontrada' }}": "{{ $stripeSub['status_label'] ?? ($stripeSub['status'] ?? 'Sem subscrição Stripe recorrente') }}",
              "{{ $stripeSub['id'] }}": "{{ $stripeSub['id'] ?? '—' }}",
              "{{ $stripeSub['created'] ? $formatStripeDate($stripeSub['created']) : '—' }}": "{{ !empty($stripeSub['created']) ? $formatStripeDate($stripeSub['created']) : '—' }}",
              "{{ $stripeSub['current_period_end'] ? $formatStripeDate($stripeSub['current_period_end']) : '—' }}": "{{ !empty($stripeSub['current_period_end']) ? $formatStripeDate($stripeSub['current_period_end']) : '—' }}",
              "{{ $stripeSub['current_period_start'] ? $formatStripeDate($stripeSub['current_period_start']) : '—' }}": "{{ !empty($stripeSub['current_period_start']) ? $formatStripeDate($stripeSub['current_period_start']) : '—' }}",
          }
          for old, new in replacements.items():
              blade = blade.replace(old, new)
          blade_path.write_text(blade)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/SubscriptionHub.php resources/views/livewire/subscription-hub.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix Stripe subscription fallback and safe plan details"
          git push
