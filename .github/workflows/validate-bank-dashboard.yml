name: Validate bank dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app/Livewire/Public/BankDashboard.php'
      - 'resources/views/livewire/public/bank-dashboard.blade.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: php -l app/Livewire/Public/BankDashboard.php
      - name: Required dashboard sections
        run: |
          grep -q 'Perfil empresarial' resources/views/livewire/public/bank-dashboard.blade.php
          grep -q 'Receita vs. despesas' resources/views/livewire/public/bank-dashboard.blade.php
          grep -q 'Últimas faturas' resources/views/livewire/public/bank-dashboard.blade.php
          grep -q 'Últimas despesas' resources/views/livewire/public/bank-dashboard.blade.php
          grep -q 'Auditoria bancária' resources/views/livewire/public/bank-dashboard.blade.php
