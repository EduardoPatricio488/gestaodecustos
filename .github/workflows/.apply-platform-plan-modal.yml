name: Apply platform plan payment modal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch platform plan modal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          php_path = Path('app/Livewire/SubscriptionHub.php')
          blade_path = Path('resources/views/livewire/subscription-hub.blade.php')

          php = php_path.read_text(encoding='utf-8')
          blade = blade_path.read_text(encoding='utf-8')

          if 'showPlatformPlanModal' not in php:
              old = 'public bool $showExtraModal = false;'
              new = old + "\n    public bool $showPlatformPlanModal = false;"
              if old not in php:
                  raise SystemExit('Could not find showExtraModal property in SubscriptionHub.php')
              php = php.replace(old, new, 1)

          if 'openPlatformPlanModal()' not in php:
              marker = '    public function openExtraModal()'
              idx = php.find(marker)
              if idx == -1:
                  raise SystemExit('Could not find openExtraModal() in SubscriptionHub.php')
              method = '''    public function openPlatformPlanModal(): void\n    {\n        $this->showPlatformPlanModal = true;\n    }\n\n    public function closePlatformPlanModal(): void\n    {\n        $this->showPlatformPlanModal = false;\n    }\n\n'''
              php = php[:idx] + method + php[idx:]

          if 'platformPayments' not in php:
              marker = '        return view('
              idx = php.find(marker)
              if idx == -1:
                  raise SystemExit('Could not find render return in SubscriptionHub.php')
              block = '''        $platformPayments = $platformPlan\n            ? Payment::where('user_id', $user->id)\n                ->where('plan_type', $planSlug)\n                ->latest('paid_at')\n                ->get()\n            : collect();\n\n'''
              php = php[:idx] + block + php[idx:]

          if "'platformPayments' => $platformPayments" not in php:
              target = "'platformPlan' => $platformPlan"
              if target not in php:
                  raise SystemExit('Could not find platformPlan in render view data')
              php = php.replace(target, target + ",\n            'platformPayments' => $platformPayments,\n            'platformCashierSubscription' => $cashierSub", 1)

          php_path.write_text(php, encoding='utf-8')

          button_pattern = re.compile(r'''<flux:button\s+:href="route\('hub\.pricing'\)"\s+wire:navigate\s+variant="ghost"\s+class="rounded-2xl font-black uppercase tracking-widest text-\[10px\] bg-white/10 hover:bg-white/20 border-none text-white">\s*Gerir Plano\s*</flux:button>''')
          replacement = '''<flux:button wire:click="openPlatformPlanModal" variant="ghost" class="rounded-2xl font-black uppercase tracking-widest text-[10px] bg-white/10 hover:bg-white/20 border-none text-white">\n                    Gerir Plano\n                </flux:button>'''
          blade, count = button_pattern.subn(replacement, blade, count=1)
          if count != 1:
              raise SystemExit(f'Could not find platform plan Gerir Plano button (matches: {count})')

          if 'x-show="showPlatformPlanModal"' not in blade:
              modal = '''\n\n    @if($showPlatformPlanModal)\n        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6" wire:click.self="closePlatformPlanModal">\n            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" wire:click="closePlatformPlanModal"></div>\n            <div class="relative w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-[2rem] bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-2xl" @keydown.escape.window="$wire.closePlatformPlanModal()">\n                <div class="sticky top-0 z-10 flex items-center justify-between gap-4 p-6 border-b border-zinc-200 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur">\n                    <div>\n                        <p class="text-[9px] font-black uppercase tracking-[0.3em] text-zinc-500 dark:text-zinc-400">Finance Pro</p>\n                        <h3 class="text-2xl font-black tracking-tight">Informação do plano e pagamentos</h3>\n                    </div>\n                    <button type="button" wire:click="closePlatformPlanModal" class="size-10 rounded-xl flex items-center justify-center hover:bg-zinc-100 dark:hover:bg-zinc-800">\n                        <flux:icon name="x-mark" class="size-5" />\n                    </button>\n                </div>\n\n                <div class="p-6 space-y-6">\n                    @if($platformPlan)\n                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">\n                            <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 p-5">\n                                <p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Plano</p>\n                                <p class="mt-1 text-lg font-black">Finance Pro {{ $platformPlan->name }}</p>\n                            </div>\n                            <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 p-5">\n                                <p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Preço</p>\n                                <p class="mt-1 text-lg font-black">{{ number_format($platformPlan->price, 2, ',', ' ') }} EUR / mês</p>\n                            </div>\n                            <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 p-5">\n                                <p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Método de pagamento</p>\n                                <p class="mt-1 text-lg font-black">{{ $platformPayments->first()?->method ?? '—' }}</p>\n                            </div>\n                            <div class="rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 p-5">\n                                <p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Estado da subscrição</p>\n                                <p class="mt-1 text-lg font-black">{{ $platformCashierSubscription?->active() ? 'Ativa' : 'Inativa' }}</p>\n                            </div>\n                        </div>\n\n                        <div>\n                            <div class="flex items-center justify-between mb-3">\n                                <h4 class="text-sm font-black uppercase tracking-widest">Registo de pagamentos</h4>\n                                <span class="text-xs font-bold text-zinc-500">{{ $platformPayments->count() }} pagamento(s)</span>\n                            </div>\n                            <div class="overflow-hidden rounded-2xl border border-zinc-200 dark:border-zinc-800">\n                                @forelse($platformPayments as $payment)\n                                    <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 p-4 border-b last:border-b-0 border-zinc-200 dark:border-zinc-800">\n                                        <div><p class="text-[9px] font-black uppercase text-zinc-500">Fatura</p><p class="text-xs font-bold break-all">{{ $payment->invoice_id }}</p></div>\n                                        <div><p class="text-[9px] font-black uppercase text-zinc-500">Valor</p><p class="text-xs font-bold">{{ number_format($payment->amount, 2, ',', ' ') }} {{ $payment->currency }}</p></div>\n                                        <div><p class="text-[9px] font-black uppercase text-zinc-500">Método</p><p class="text-xs font-bold">{{ $payment->method }}</p></div>\n                                        <div><p class="text-[9px] font-black uppercase text-zinc-500">Estado</p><p class="text-xs font-bold">{{ ucfirst($payment->status) }}</p></div>\n                                        <div><p class="text-[9px] font-black uppercase text-zinc-500">Data</p><p class="text-xs font-bold">{{ $payment->paid_at?->format('d/m/Y H:i') ?? '—' }}</p></div>\n                                    </div>\n                                @empty\n                                    <div class="p-6 text-sm text-zinc-500">Ainda não existem pagamentos registados para este plano.</div>\n                                @endforelse\n                            </div>\n                        </div>\n\n                        <div class="rounded-2xl border border-amber-200 dark:border-amber-900/50 bg-amber-50 dark:bg-amber-950/20 p-5">\n                            <p class="text-xs font-bold text-amber-800 dark:text-amber-300">Dados bancários</p>\n                            <p class="mt-1 text-xs text-amber-700 dark:text-amber-400">Não são mostrados números completos de cartões, contas bancárias ou outros dados financeiros sensíveis. O sistema apresenta apenas os dados de pagamento que estão efetivamente registados.</p>\n                        </div>\n                    @endif\n                </div>\n            </div>\n        </div>\n    @endif\n'''
              pos = blade.rfind('</div>')
              if pos == -1:
                  raise SystemExit('Could not find root closing div in subscription-hub.blade.php')
              blade = blade[:pos] + modal + blade[pos:]

          blade_path.write_text(blade, encoding='utf-8')
          print('Patch completed successfully.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/SubscriptionHub.php resources/views/livewire/subscription-hub.blade.php .github/workflows/.apply-platform-plan-modal.yml
          git rm -f .github/workflows/.apply-platform-plan-modal.yml
          git commit -m "feat: add platform plan payment details modal"
          git push origin main
