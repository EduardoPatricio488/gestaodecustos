name: Fix theme persistence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure pricing sidebar
        shell: python
        run: |
          from pathlib import Path
          layout = Path('resources/views/components/layouts/app.blade.php')
          s = layout.read_text(encoding='utf-8')

          old = "@if(request()->routeIs('hub.business.gateway'))"
          new = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))"
          if old in s and "request()->routeIs('hub.pricing')" not in s:
              s = s.replace(old, new, 1)
          elif old not in s and "request()->routeIs('hub.pricing')" not in s:
              marker = '<flux:sidebar.nav>'
              if marker not in s:
                  raise SystemExit('Sidebar navigation marker not found')
              gateway = '''<flux:sidebar.nav>
    @if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))
        {{-- Hub Business e Planos: apenas empresas acessíveis ao utilizador --}}
        <div class="px-2 py-4">
            @if($allBusinessWs->count() > 0)
                <div class="space-y-1">
                    @foreach($allBusinessWs as $ws)
                        <flux:sidebar.item
                            icon="building-office-2"
                            :href="route('workspace.switch.fast', $ws->id)"
                            wire:navigate
                            class="text-[11px] font-bold py-2"
                        >
                            {{ $ws->name }}
                        </flux:sidebar.item>
                    @endforeach
                </div>
            @else
                <div class="rounded-2xl border border-dashed border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50 p-4 text-center">
                    <flux:icon name="building-office-2" class="size-7 mx-auto text-zinc-300 dark:text-zinc-700 mb-2" />
                    <p class="text-[10px] font-black uppercase text-zinc-500 dark:text-zinc-400">Não tens nenhuma empresa</p>
                </div>
            @endif
        </div>
    @else
'''
              s = s.replace(marker, gateway, 1)
              closing = '</flux:sidebar.nav>'
              pos = s.rfind(closing)
              if pos == -1:
                  raise SystemExit('Sidebar closing marker not found')
              s = s[:pos] + '    @endif\n' + s[pos:]

          layout.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          git diff --cached --quiet || git commit -m "Limit pricing page sidebar to user companies"
          git push
          git rm .github/workflows/fix-theme-persistence.yml
          git commit -m "Remove temporary pricing sidebar workflow"
          git push
