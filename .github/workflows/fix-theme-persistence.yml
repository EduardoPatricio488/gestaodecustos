name: Fix pricing and business hub sidebar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-sidebar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated sidebar to pricing and business hub
        shell: python
        run: |
          from pathlib import Path
          layout = Path('resources/views/components/layouts/app.blade.php')
          s = layout.read_text(encoding='utf-8')

          special = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))"
          if special not in s:
              marker = '<flux:sidebar.nav>'
              start_marker = '<flux:sidebar.nav>\n'
              if marker not in s:
                  raise SystemExit('Sidebar navigation marker not found')

              replacement = '''<flux:sidebar.nav>
    @if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))
        {{-- Nestas duas páginas a sidebar mostra apenas as empresas do utilizador. --}}
        <div class="px-2 py-4">
            @if($allBusinessWs->count() > 0)
                <div class="space-y-1">
                    @foreach($allBusinessWs as $ws)
                        <flux:sidebar.item
                            icon="building-office-2"
                            :href="route('workspace.switch.fast', $ws->id)"
                            wire:navigate
                            class="text-[11px] font-bold py-2"
                        >
                            {{ $ws->name }}
                        </flux:sidebar.item>
                    @endforeach
                </div>
            @else
                <div class="rounded-2xl border border-dashed border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50 p-4 text-center">
                    <flux:icon name="building-office-2" class="size-7 mx-auto text-zinc-300 dark:text-zinc-700 mb-2" />
                    <p class="text-[10px] font-black uppercase text-zinc-500 dark:text-zinc-400">Não tens nenhuma empresa</p>
                </div>
            @endif
        </div>
    @else
'''
              s = s.replace(marker, replacement, 1)

              closing = '</flux:sidebar.nav>'
              pos = s.rfind(closing)
              if pos == -1:
                  raise SystemExit('Sidebar closing marker not found')
              s = s[:pos] + '    @endif\n' + s[pos:]

              layout.write_text(s, encoding='utf-8')
          else:
              print('Pricing/business hub sidebar already patched; no layout change needed.')

      - name: Commit layout and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          if ! git diff --cached --quiet; then
            git commit -m "Limit pricing and business hub sidebars"
            git push
          fi
          git rm .github/workflows/fix-theme-persistence.yml
          git commit -m "Remove temporary sidebar workflow"
          git push
