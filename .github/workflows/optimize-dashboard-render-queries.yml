name: Optimize dashboard render queries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix bank balance accessor query
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/Livewire/Dashboard.php")
          text = path.read_text(encoding="utf-8")

          old = """        $totalBankBalance = (float) Cache::remember(
            \"dashboard:bank-balance:{$currentWs->id}\",
            60,
            fn () => (float) BankAccount::where('workspace_id', $currentWs->id)->sum('current_balance')
        );"""

          new = """        $totalBankBalance = (float) Cache::remember(
            \"dashboard:bank-balance:{$currentWs->id}\",
            60,
            function () use ($currentWs): float {
                // current_balance is an Eloquent accessor, not a database column.
                $baseBalance = (float) BankAccount::where('workspace_id', $currentWs->id)
                    ->sum('balance');

                $incomeBalance = (float) Income::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                $expenseBalance = (float) Expense::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                $recurringDue = (float) RecurringIncome::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->where('is_active', true)
                    ->where('day_of_month', '<=', now()->day)
                    ->sum('amount');

                return $baseBalance + $incomeBalance - $expenseBalance + $recurringDue;
            }
        );"""

          if old not in text:
              raise SystemExit("Invalid current_balance query not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate PHP syntax
        run: php -l app/Livewire/Dashboard.php

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php
          git commit -m "Fix dashboard bank balance calculation"
          git push
