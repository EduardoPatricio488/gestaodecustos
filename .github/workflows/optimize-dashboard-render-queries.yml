name: Optimize dashboard render queries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize dashboard render hot paths
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/Livewire/Dashboard.php")
          text = path.read_text(encoding="utf-8")
          changed = False

          old = """        $financeScore = app(FinanceScoreService::class)->calculate($currentWs);
          $wellnessInsights = app(WellnessFinanceService::class)->getInsights($currentWs);
          $storeEntitlements = app(StoreEntitlementService::class);"""
          new = """        $financeScore = Cache::remember(
            \"dashboard:finance-score:{$currentWs->id}\",
            60,
            fn () => app(FinanceScoreService::class)->calculate($currentWs)
        );

        $wellnessInsights = Cache::remember(
            \"dashboard:wellness:{$currentWs->id}\",
            60,
            fn () => app(WellnessFinanceService::class)->getInsights($currentWs)
        );

        $storeEntitlements = app(StoreEntitlementService::class);"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """    private function buildSixMonthSeries(int $workspaceId, $start, $end, float $fixedIncome): Collection
    {
        $expenses = Expense::where('workspace_id', $workspaceId)
            ->whereBetween('spent_at', [$start, $end])
            ->get(['amount', 'spent_at'])
            ->groupBy(fn ($expense) => $expense->spent_at->format('Y-m'))
            ->map(fn ($rows) => (float) $rows->sum('amount'));

        $incomes = Income::where('workspace_id', $workspaceId)
            ->whereBetween('received_at', [$start, $end])
            ->get(['amount', 'received_at'])
            ->groupBy(fn ($income) => $income->received_at->format('Y-m'))
            ->map(fn ($rows) => (float) $rows->sum('amount'));

        return collect(range(5, 0))->map(function ($i) use ($expenses, $incomes, $fixedIncome) {
            $month = now()->subMonths($i);
            $key = $month->format('Y-m');

            return [
                'label' => $month->translatedFormat('M'),
                'spent' => (float) ($expenses[$key] ?? 0),
                'earned' => (float) ($incomes[$key] ?? 0) + $fixedIncome,
            ];
        });
    }"""
          new = """    private function buildSixMonthSeries(int $workspaceId, $start, $end, float $fixedIncome): Collection
    {
        $driver = DB::connection()->getDriverName();
        $expenseMonthExpression = $driver === 'sqlite'
            ? \"strftime('%Y-%m', spent_at)\"
            : \"DATE_FORMAT(spent_at, '%Y-%m')\";
        $incomeMonthExpression = $driver === 'sqlite'
            ? \"strftime('%Y-%m', received_at)\"
            : \"DATE_FORMAT(received_at, '%Y-%m')\";

        // Aggregate in SQL instead of loading every transaction into PHP.
        $expenses = Expense::where('workspace_id', $workspaceId)
            ->whereBetween('spent_at', [$start, $end])
            ->selectRaw(\"{$expenseMonthExpression} as month, SUM(amount) as total\")
            ->groupBy('month')
            ->pluck('total', 'month')
            ->map(fn ($value) => (float) $value);

        $incomes = Income::where('workspace_id', $workspaceId)
            ->whereBetween('received_at', [$start, $end])
            ->selectRaw(\"{$incomeMonthExpression} as month, SUM(amount) as total\")
            ->groupBy('month')
            ->pluck('total', 'month')
            ->map(fn ($value) => (float) $value);

        return collect(range(5, 0))->map(function ($i) use ($expenses, $incomes, $fixedIncome) {
            $month = now()->subMonths($i);
            $key = $month->format('Y-m');

            return [
                'label' => $month->translatedFormat('M'),
                'spent' => (float) ($expenses[$key] ?? 0),
                'earned' => (float) ($incomes[$key] ?? 0) + $fixedIncome,
            ];
        });
    }"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          if not changed:
              print('No dashboard changes required; exiting successfully.')
          else:
              path.write_text(text, encoding='utf-8')

      - name: Validate PHP syntax
        run: php -l app/Livewire/Dashboard.php

      - name: Commit optimization if changed
        shell: bash
        run: |
          if git diff --quiet -- app/Livewire/Dashboard.php; then
            echo "Dashboard already optimized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php
          git commit -m "perf: optimize dashboard aggregates and cached services"
          git push
