name: Optimize dashboard render queries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize repeated dashboard queries
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/Livewire/Dashboard.php")
          text = path.read_text(encoding="utf-8")
          original = text

          old = """        $subscriptionsMonthlyCost = (float) Subscription::where('workspace_id', $currentWs->id)
            ->get(['amount', 'cycle', 'status', 'is_active'])
            ->filter(fn ($sub) => ($sub->status ?: ($sub->is_active ? 'active' : 'paused')) === 'active')
            ->sum(fn ($sub) => SubscriptionCycleService::toMonthly((float) $sub->amount, $sub->cycle));
"""
          new = """        $subscriptionsMonthlyCost = (float) Cache::remember(
            \"dashboard:subscriptions-monthly:{$currentWs->id}\",
            60,
            fn () => Subscription::where('workspace_id', $currentWs->id)
                ->where(function ($query) {
                    $query->where('status', 'active')
                        ->orWhere(function ($query) {
                            $query->whereNull('status')->where('is_active', true);
                        });
                })
                ->get(['amount', 'cycle'])
                ->sum(fn ($sub) => SubscriptionCycleService::toMonthly((float) $sub->amount, $sub->cycle))
        );
"""
          if old not in text:
              raise SystemExit("subscriptions block not found")
          text = text.replace(old, new, 1)

          old = """        $pendingDebtsToPay = (float) Debt::where('workspace_id', $currentWs->id)
            ->where('type', 'owe')
            ->where('is_paid', false)
            ->sum('amount');

        $pendingDebtsToReceive = (float) Debt::where('workspace_id', $currentWs->id)
            ->where('type', 'owed')
            ->where('is_paid', false)
            ->sum('amount');
"""
          new = """        $pendingDebts = Cache::remember(
            \"dashboard:pending-debts:{$currentWs->id}\",
            60,
            fn () => Debt::where('workspace_id', $currentWs->id)
                ->where('is_paid', false)
                ->selectRaw(\"COALESCE(SUM(CASE WHEN type = 'owe' THEN amount ELSE 0 END), 0) as to_pay\")
                ->selectRaw(\"COALESCE(SUM(CASE WHEN type = 'owed' THEN amount ELSE 0 END), 0) as to_receive\")
                ->first()
        );

        $pendingDebtsToPay = (float) ($pendingDebts->to_pay ?? 0);
        $pendingDebtsToReceive = (float) ($pendingDebts->to_receive ?? 0);
"""
          if old not in text:
              raise SystemExit("debt blocks not found")
          text = text.replace(old, new, 1)

          old = """        $totalMonthExpenses = $monthTotals['expenses'];
        $totalMonthIncome = $monthTotals['income'] + $fixedIncome;
"""
          new = """        $totalMonthExpenses = $monthTotals['expenses'];
        $totalMonthIncome = $monthTotals['income'] + $fixedIncome;
"""
          # Keep this marker replacement intentionally neutral; it validates the expected render structure.
          if old not in text:
              raise SystemExit("month totals marker not found")

          # Cache the expensive service-level dashboard insights so repeated Livewire renders
          # do not recompute the same workspace data during the same minute.
          old = """        $financeScore = app(FinanceScoreService::class)->calculate($currentWs);
        $wellnessInsights = app(WellnessFinanceService::class)->getInsights($currentWs);
"""
          new = """        $financeScore = Cache::remember(
            \"dashboard:finance-score:{$currentWs->id}\",
            60,
            fn () => app(FinanceScoreService::class)->calculate($currentWs)
        );
        $wellnessInsights = Cache::remember(
            \"dashboard:wellness:{$currentWs->id}\",
            60,
            fn () => app(WellnessFinanceService::class)->getInsights($currentWs)
        );
"""
          if old not in text:
              raise SystemExit("score/wellness block not found")
          text = text.replace(old, new, 1)

          if text == original:
              raise SystemExit("No changes made")
          path.write_text(text, encoding="utf-8")

          Path(".github/workflows/optimize-dashboard-render-queries.yml").unlink(missing_ok=True)
      - name: Validate PHP syntax
        run: php -l app/Livewire/Dashboard.php
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php .github/workflows/optimize-dashboard-render-queries.yml
          git commit -m "Reduce dashboard render query count"
          git push
