name: Repair Dashboard PostgreSQL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch PostgreSQL date aggregation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Livewire/Dashboard.php')
          text = path.read_text(encoding='utf-8')
          old = """        $driver = DB::connection()->getDriverName();
        $expenseMonth = $driver === 'sqlite' ? \"strftime('%Y-%m', spent_at)\" : \"DATE_FORMAT(spent_at, '%Y-%m')\";
        $incomeMonth = $driver === 'sqlite' ? \"strftime('%Y-%m', received_at)\" : \"DATE_FORMAT(received_at, '%Y-%m')\";
"""
          new = """        $driver = DB::connection()->getDriverName();

        $expenseMonth = match ($driver) {
            'sqlite' => \"strftime('%Y-%m', spent_at)\",
            'pgsql' => \"TO_CHAR(spent_at, 'YYYY-MM')\",
            default => \"DATE_FORMAT(spent_at, '%Y-%m')\",
        };

        $incomeMonth = match ($driver) {
            'sqlite' => \"strftime('%Y-%m', received_at)\",
            'pgsql' => \"TO_CHAR(received_at, 'YYYY-MM')\",
            default => \"DATE_FORMAT(received_at, '%Y-%m')\",
        };
"""
          if old not in text:
              raise SystemExit('Expected old PostgreSQL-incompatible block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate syntax
        run: php -l app/Livewire/Dashboard.php

      - name: Commit fix and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Livewire/Dashboard.php
          git rm .github/workflows/repair-dashboard-pgsql.yml
          git rm .github/workflows/fix-pgsql-dashboard.yml || true
          git commit -m 'fix: support PostgreSQL dashboard month aggregation'
          git push
