name: Validate portal access flows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate PHP syntax
        run: |
          php -l app/Livewire/Business/ClientLogin.php
          php -l app/Livewire/Public/SupplierPortal.php
          php -l app/Models/PortalAccessRequest.php
          php -l app/Mail/PortalAccessRequestMail.php
          php -l database/migrations/2026_09_11_120000_create_portal_access_requests_table.php

      - name: Validate portal templates
        run: |
          grep -q 'Entrar no Portal' resources/views/livewire/business/client-login.blade.php
          grep -q 'Solicitar acesso' resources/views/livewire/business/client-login.blade.php
          grep -q 'Entrar no Portal' resources/views/livewire/public/supplier-portal.blade.php
          grep -q 'Solicitar acesso' resources/views/livewire/public/supplier-portal.blade.php
          grep -q 'Enviar pedido à empresa' resources/views/livewire/business/client-login.blade.php
          grep -q 'Enviar pedido à empresa' resources/views/livewire/public/supplier-portal.blade.php
          ! grep -q 'Introduzir dados de acesso' resources/views/livewire/business/client-login.blade.php
          ! grep -q 'Introduzir dados de acesso' resources/views/livewire/public/supplier-portal.blade.php
