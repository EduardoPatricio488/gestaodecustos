name: Lock training zone behind Pro plan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock-fitness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sidebar
        shell: python
        run: |
          from pathlib import Path
          p=Path('resources/views/components/layouts/app.blade.php')
          s=p.read_text()
          start=s.find('{{-- ✅ ZONA DE TREINO')
          if start == -1: raise SystemExit('Fitness sidebar marker not found')
          end=s.find('</flux:sidebar.item>', start)
          if end == -1: raise SystemExit('Fitness sidebar closing tag not found')
          end += len('</flux:sidebar.item>')
          new='''{{-- ZONA DE TREINO — PREMIUM --}}
                <flux:sidebar.item
                    icon="bolt"
                    :href="$isAnyPremium ? route('hub.fitness') : route('hub.pricing')"
                    :current="request()->routeIs('hub.fitness')"
                    wire:navigate.hover
                    class="text-orange-500 dark:text-orange-400 font-black relative {{ !$isAnyPremium ? 'opacity-60 grayscale' : '' }}"
                >
                    <span class="flex items-center justify-between w-full">
                        <span>Zona de Treino</span>
                        @if($isAnyPremium)
                            {!! $badge($counts['fitness']) !!}
                            <span class="ml-auto text-[8px] font-black bg-orange-100 text-orange-600 dark:bg-orange-500/10 dark:text-orange-400 px-1.5 py-0.5 rounded uppercase">Novo</span>
                        @else
                            <span class="ml-auto inline-flex items-center gap-1 text-[8px] font-black bg-violet-100 text-violet-600 dark:bg-violet-500/10 dark:text-violet-400 px-1.5 py-0.5 rounded uppercase tracking-wide"><flux:icon name="lock-closed" class="size-2.5" /> PRO</span>
                        @endif
                    </span>
                </flux:sidebar.item>'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/views/components/layouts/app.blade.php
          git commit -m "Lock training zone behind Pro plan" || exit 0
          git push
