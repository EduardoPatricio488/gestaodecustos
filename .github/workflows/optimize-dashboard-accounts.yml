name: Optimize dashboard accounts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Optimize bank account aggregation
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/Livewire/Dashboard.php')
          text = path.read_text(encoding='utf-8')

          old = '''        // Saldo bancário atual (todas as contas do workspace) para o Saldo Estimado refletir o que
        // já existe na conta, e não apenas o fluxo isolado deste mês.
        $totalBankBalance = (float) Cache::remember(
            "dashboard:bank-balance:{$currentWs->id}",
            60,
            function () use ($currentWs): float {
                $baseBalance = (float) BankAccount::where('workspace_id', $currentWs->id)
                    ->sum('balance');

                $incomeBalance = (float) Income::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                $expenseBalance = (float) Expense::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                return $baseBalance + $incomeBalance - $expenseBalance;
            }
        );

        $projectedBalance = $totalBankBalance + $projectedIncome - $projectedExpenses;
        $projectionStatus = $projectedBalance < 0 ? 'critical' : ($projectedBalance < ($totalMonthIncome * 0.15) ? 'warning' : 'stable');

        // --- RESUMO DA CONTA (widget premium) ---
        $topBankAccounts = Cache::remember(
            "dashboard:top-accounts:{$currentWs->id}",
            60,
            // Guarda um array simples (não uma Collection) para evitar corrupção ao
            // fazer unserialize a partir da cache.
            fn () => BankAccount::where('workspace_id', $currentWs->id)
                ->get()
                ->sortByDesc(fn ($account) => $account->current_balance)
                ->take(3)
                ->map(fn ($account) => [
                    'name' => $account->name,
                    'balance' => $account->current_balance,
                    'icon' => $account->getIcon(),
                    'color' => $account->color ?? '#6366f1',
                ])
                ->values()
                ->all()
        );
'''

          new = '''        // --- RESUMO BANCÁRIO ---
        // Agrega os movimentos na BD em vez de chamar o accessor current_balance
        // para cada conta (o accessor anterior provocava N+1 queries).
        $bankAccountSnapshot = Cache::remember(
            "dashboard:bank-accounts:{$currentWs->id}",
            60,
            fn () => BankAccount::where('workspace_id', $currentWs->id)
                ->withSum('incomes as dashboard_income_total', 'amount')
                ->withSum('expenses as dashboard_expense_total', 'amount')
                ->withSum([
                    'recurringIncomes as dashboard_recurring_due' => fn ($query) => $query
                        ->where('is_active', true)
                        ->where('day_of_month', '<=', now()->day),
                ], 'amount')
                ->get([
                    'id',
                    'name',
                    'workspace_id',
                    'balance',
                    'icon',
                    'color',
                ])
                ->map(function ($account) {
                    $balance = (float) $account->balance
                        + (float) ($account->dashboard_income_total ?? 0)
                        - (float) ($account->dashboard_expense_total ?? 0)
                        + (float) ($account->dashboard_recurring_due ?? 0);

                    return [
                        'id' => $account->id,
                        'name' => $account->name,
                        'balance' => $balance,
                        'icon' => $account->getIcon(),
                        'color' => $account->color ?? '#6366f1',
                    ];
                })
                ->values()
                ->all()
        );

        $totalBankBalance = (float) collect($bankAccountSnapshot)->sum('balance');
        $topBankAccounts = collect($bankAccountSnapshot)
            ->sortByDesc('balance')
            ->take(3)
            ->values()
            ->all();

        $projectedBalance = $totalBankBalance + $projectedIncome - $projectedExpenses;
        $projectionStatus = $projectedBalance < 0 ? 'critical' : ($projectedBalance < ($totalMonthIncome * 0.15) ? 'warning' : 'stable');
'''

          if old not in text:
              raise SystemExit('Expected dashboard bank-account block was not found; aborting without changes.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit optimized dashboard
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Livewire/Dashboard.php
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'perf: eliminate dashboard bank account N+1 queries'
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/optimize-dashboard-accounts.yml || true
          git commit -m 'chore: remove temporary dashboard optimizer' || true
          git push || true
