name: Fix Business Dashboard NIF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch dashboard
        run: |
          git checkout 1bd11cb24715926ad3ddccde5a314b7a4f5b8ead -- resources/views/livewire/business/business-dashboard.blade.php
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resources/views/livewire/business/business-dashboard.blade.php')
          text = p.read_text(encoding='utf-8')
          old = "<span :class=\"privacyMode ? 'blur-sm select-none' : ''\">{{ $workspace->tax_number ?? 'S/ NIF' }}</span>"
          new = "<span :class=\"privacyMode ? 'blur-sm select-none' : ''\">{{ ($workspace->tax_number ?? '') !== '' ? implode(' ', str_split(preg_replace('/\\D/', '', (string) $workspace->tax_number), 3)) : 'S/ NIF' }}</span>"
          if old not in text:
              raise SystemExit('NIF display block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/livewire/business/business-dashboard.blade.php
          git commit -m 'Format business dashboard NIF in groups of three'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-dashboard-nif.yml
          git commit -m 'Remove temporary dashboard NIF workflow'
          git push
