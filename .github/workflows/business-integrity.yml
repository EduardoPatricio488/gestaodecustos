name: business-integrity

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: write

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --no-check-publish
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^ HEAD -- '*.php' || true)
          if [ -z "$files" ]; then echo "No PHP files changed in this commit."; exit 0; fi
          while IFS= read -r file; do [ -f "$file" ] && php -l "$file"; done <<< "$files"

  business-tests:
    runs-on: ubuntu-latest
    needs: php-syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: '{"http-basic":{"composer.fluxui.dev":{"username":"${{ secrets.FLUX_USERNAME }}","password":"${{ secrets.FLUX_LICENSE_KEY }}"}}}'
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Pint check
        run: ./vendor/bin/pint --parallel --test
      - name: Run full Laravel test suite
        shell: bash
        run: |
          set +e
          ./vendor/bin/pest --without-tty > /tmp/pest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "CI diagnostic generated automatically."
              echo ""
              tail -n 200 /tmp/pest.log
            } > ci-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-failure.log
            git commit -m "ci: capture temporary test diagnostics" || true
            git push || true
          fi
          exit "$status"
