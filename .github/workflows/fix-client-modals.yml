name: Fix Client Modals

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix portal and history modal controls
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('resources/views/livewire/business/client-hub.blade.php')
          s = p.read_text(encoding='utf-8')

          # Portal modal: add a working X close button in the header and make the footer close explicit.
          portal = re.search(r'(<flux:modal name="portal-link-modal".*?</flux:modal>)', s, re.S)
          if not portal:
              raise SystemExit('portal-link-modal not found')
          block = portal.group(1)

          if 'aria-label="Fechar"' not in block:
              block = block.replace(
                  '''            <div class="flex items-center gap-4">''',
                  '''            <div class="flex items-start justify-between gap-4">\n                <div class="flex items-center gap-4">''',
                  1,
              )
              block = block.replace(
                  '''                    <p class="text-xs text-zinc-400 font-medium mt-1">Geração de credenciais únicas para o cliente.</p>\n                </div>\n            </div>''',
                  '''                    <p class="text-xs text-zinc-400 font-medium mt-1">Geração de credenciais únicas para o cliente.</p>\n                </div>\n                <flux:modal.close>\n                    <flux:button type="button" variant="ghost" icon="x-mark" size="sm" class="rounded-full" aria-label="Fechar" />\n                </flux:modal.close>\n            </div>''',
                  1,
              )
          block = block.replace(
              '''<flux:modal.close class="flex-1"><flux:button variant="ghost" class="w-full font-black uppercase text-[10px]">Fechar</flux:button></flux:modal.close>''',
              '''<flux:modal.close class="flex-1">\n                    <flux:button type="button" variant="ghost" class="w-full font-black uppercase text-[10px]">Fechar</flux:button>\n                </flux:modal.close>''',
              1,
          )
          s = s[:portal.start()] + block + s[portal.end():]

          # History modal: force centered positioning, constrain height, make it scrollable,
          # and keep a reliable X close button in the header.
          s = s.replace(
              '<flux:modal name="history-modal" position="center" class="md:w-[800px] !p-0 overflow-visible">',
              '<flux:modal name="history-modal" position="center" class="!fixed !inset-0 !m-auto w-[calc(100vw-2rem)] max-w-[800px] !max-h-[90vh] !p-0 overflow-hidden">',
              1,
          )
          s = s.replace(
              '<div class="relative p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-8 shadow-2xl border border-zinc-200 dark:border-zinc-800 text-left">\n            @if($selectedClient)',
              '<div class="relative max-h-[90vh] overflow-y-auto overscroll-contain p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-8 shadow-2xl border border-zinc-200 dark:border-zinc-800 text-left">\n            @if($selectedClient)',
              1,
          )
          s = s.replace(
              '<flux:modal.close><flux:button variant="ghost" icon="x-mark" size="sm" class="rounded-full" /></flux:modal.close>',
              '<flux:modal.close>\n                        <flux:button type="button" variant="ghost" icon="x-mark" size="sm" class="rounded-full" aria-label="Fechar" />\n                    </flux:modal.close>',
              1,
          )

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/client-hub.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix client portal and history modal controls"
          git push
