name: Personal audit hardening

on:
  push:
    branches: [main]

jobs:
  harden:
    if: github.event.head_commit.message != 'chore(audit): apply personal finance hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch security and parsing issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bank = Path('app/Services/BankImportService.php')
          text = bank.read_text(encoding='utf-8')
          old = """    private function parseAmount(string $value): ?float
    {
        $value = trim(str_replace(['€', 'EUR', ' '], '', $value));
        $value = str_replace('.', '', $value);
        $value = str_replace(',', '.', $value);
        if (! is_numeric($value)) {
            return null;
        }

        return (float) $value;
    }
"""
          new = """    private function parseAmount(string $value): ?float
    {
        $value = trim($value);
        if ($value === '') {
            return null;
        }

        $negative = str_starts_with($value, '-') || (str_starts_with($value, '(') && str_ends_with($value, ')'));
        $value = trim($value, "() ");
        $value = str_replace(['€', 'EUR', 'eur', ' '], '', $value);

        if ($value === '' || ! preg_match('/^[+-]?[0-9.,]+$/', $value)) {
            return null;
        }

        $lastComma = strrpos($value, ',');
        $lastDot = strrpos($value, '.');

        if ($lastComma !== false && $lastDot !== false) {
            // The last separator is the decimal separator: 1.234,56 or 1,234.56.
            if ($lastComma > $lastDot) {
                $value = str_replace('.', '', $value);
                $value = str_replace(',', '.', $value);
            } else {
                $value = str_replace(',', '', $value);
            }
        } elseif ($lastComma !== false) {
            $fractionLength = strlen($value) - $lastComma - 1;
            $value = $fractionLength === 1 || $fractionLength === 2
                ? str_replace(',', '.', $value)
                : str_replace(',', '', $value);
        } elseif ($lastDot !== false) {
            $fractionLength = strlen($value) - $lastDot - 1;
            // A single dot followed by 1-2 digits is a decimal amount (10.50).
            // Three digits after a dot are treated as a thousands separator (1.234).
            if ($fractionLength === 1 || $fractionLength === 2) {
                // keep decimal point
            } else {
                $value = str_replace('.', '', $value);
            }
        }

        if (! is_numeric($value)) {
            return null;
        }

        $amount = (float) $value;
        return $negative ? -abs($amount) : $amount;
    }
"""
          if old not in text:
              raise SystemExit('BankImportService parseAmount block not found')
          bank.write_text(text.replace(old, new), encoding='utf-8')

          inv = Path('app/Livewire/InvestmentsHub.php')
          text = inv.read_text(encoding='utf-8')
          text = text.replace("    const ALPHA_VANTAGE_KEY = 'WPP1D4IXEJ1U7J4V';", "    private const ALPHA_VANTAGE_KEY = null;")
          text = text.replace("'apikey' => self::ALPHA_VANTAGE_KEY,", "'apikey' => config('services.market_data.alpha_vantage_api_key'),")
          text = text.replace("$apiKey = config('services.openrouter.api_key');", "$apiKey = config('services.openrouter.api_key');\n        $marketDataKey = config('services.market_data.alpha_vantage_api_key');")
          text = text.replace("        if (blank($apiKey)) {\n            return ['analysis_message' => 'A análise IA não está configurada neste ambiente.'];\n        }", "        if (blank($apiKey)) {\n            return ['analysis_message' => 'A análise IA não está configurada neste ambiente.'];\n        }\n\n        if (blank($marketDataKey)) {\n            return ['analysis_message' => 'Não existem dados de mercado verificados configurados para esta análise. A IA não irá inventar fundamentais, rácios ou uma recomendação.'];\n        }")
          text = text.replace("            Faz uma análise financeira profunda da empresa '{$company}'.", "            Faz uma análise financeira da empresa '{$company}' usando EXCLUSIVAMENTE dados financeiros verificados fornecidos pela aplicação. Se um indicador não estiver presente nos dados fornecidos, devolve null e indica 'dados insuficientes'. Nunca uses conhecimento de memória, estimativas ou valores inventados para preencher receita, margens, P/E, P/B, cashflow, score ou recomendação.")
          text = text.replace("                ['role' => 'system', 'content' => 'És um analista financeiro profissional.'],", "                ['role' => 'system', 'content' => 'És um analista financeiro. Regra absoluta: nunca inventes dados. Só podes afirmar métricas que estejam nos dados verificados fornecidos pela aplicação. Se faltarem dados, declara insuficiência e não atribuas Comprar/Manter/Vender.'],")
          inv.write_text(text, encoding='utf-8')
          PY

      - name: Add parser and score regression tests
        shell: bash
        run: |
          cat > tests/Unit/BankImportAmountParserTest.php <<'PHP'
          <?php

          use App\Services\BankImportService;
          use ReflectionMethod;

          it('parses common Portuguese and international monetary formats without changing magnitude', function (string $input, float $expected) {
              $service = app(BankImportService::class);
              $method = new ReflectionMethod($service, 'parseAmount');
              $method->setAccessible(true);

              expect($method->invoke($service, $input))->toBe($expected);
          })->with([
              ['10.50', 10.50],
              ['10,50', 10.50],
              ['1.234,56', 1234.56],
              ['1,234.56', 1234.56],
              ['1234.56', 1234.56],
              ['1234,56', 1234.56],
              ['-10,50', -10.50],
              ['(10.50)', -10.50],
              ['€ 10,50', 10.50],
          ]);
          PHP

          cat > tests/Unit/FinanceScoreServiceTest.php <<'PHP'
          <?php

          use App\Models\Workspace;
          use App\Services\FinanceScoreService;

          it('returns an explicitly insufficient score when no personal financial data exists', function () {
              $workspace = Workspace::factory()->create(['type' => 'personal']);

              $result = app(FinanceScoreService::class)->calculate($workspace);

              expect($result['score'])->toBe(0)
                  ->and($result['data_quality']['status'])->toBe('insufficient')
                  ->and($result['data_quality']['available_components'])->toBe(0);
          });
          PHP

      - name: Run focused tests
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test tests/Unit/BankImportAmountParserTest.php tests/Unit/FinanceScoreServiceTest.php

      - name: Commit hardening and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/personal-audit-hardening.yml
          git add app/Services/BankImportService.php app/Livewire/InvestmentsHub.php tests/Unit/BankImportAmountParserTest.php tests/Unit/FinanceScoreServiceTest.php .github/workflows/personal-audit-hardening.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(audit): apply personal finance hardening'
          git push
