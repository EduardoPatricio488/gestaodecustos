name: Repair Composer lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Synchronize lock file metadata
        run: composer update --lock --no-interaction --no-scripts

      - name: Commit lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'ci: synchronize composer lock file'
          git push origin main
