name: Fix Hub Business and Plans sidebar

on:
  push:
    branches: [main]

jobs:
  fix-sidebar:
    if: github.actor == 'EduardoPatricio488'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace sidebar for Hub Business and Plans
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('resources/views/components/layouts/app.blade.php')
          s = path.read_text(encoding='utf-8')

          marker = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))"
          if marker in s:
              raise SystemExit('Patch already present')

          nav_open = '<flux:sidebar.nav>'
          nav_close = '</flux:sidebar.nav>'
          start = s.find(nav_open)
          end = s.find(nav_close, start)
          if start == -1 or end == -1:
              raise SystemExit('Sidebar nav boundaries not found')

          minimal = '''<flux:sidebar.nav>
                @if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))
                    <div class="px-2 py-4">
                        @if($allBusinessWs->count() > 0)
                            <div class="space-y-1">
                                @foreach($allBusinessWs as $ws)
                                    <flux:sidebar.item
                                        icon="building-office-2"
                                        :href="route('workspace.switch.fast', $ws->id)"
                                        wire:navigate
                                        class="text-[11px] font-bold py-2"
                                    >
                                        {{ $ws->name }}
                                    </flux:sidebar.item>
                                @endforeach
                            </div>
                        @else
                            <div class="rounded-2xl border border-dashed border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50 p-4 text-center">
                                <flux:icon name="building-office-2" class="size-7 mx-auto text-zinc-300 dark:text-zinc-700 mb-2" />
                                <p class="text-[10px] font-black uppercase text-zinc-500 dark:text-zinc-400">Não tens nenhuma empresa</p>
                            </div>
                        @endif
                    </div>
                @else
'''

          original_body = s[start + len(nav_open):end]
          replacement = minimal + original_body + '                @endif\n            '
          s = s[:start] + replacement + s[end:]
          path.write_text(s, encoding='utf-8')

      - name: Commit sidebar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix sidebar on Hub Business and Plans"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-hub-pricing-sidebar.yml
          git add .github/workflows/fix-hub-pricing-sidebar.yml
          git commit -m "Remove temporary sidebar fix workflow"
          git push
