name: Format Business Profile NIF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch NIF input
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/livewire/business/business-settings.blade.php')
          text = path.read_text(encoding='utf-8')

          old = '''                        <flux:input wire:model="tax_number"
                            placeholder="509 882 314"
                            class="font-black !bg-zinc-50 dark:!bg-zinc-950 !border-none rounded-2xl h-14 shadow-inner" />'''

          new = '''                        <flux:input wire:model.live="tax_number"
                            placeholder="509 882 314"
                            inputmode="numeric"
                            maxlength="11"
                            autocomplete="off"
                            class="font-black !bg-zinc-50 dark:!bg-zinc-950 !border-none rounded-2xl h-14 shadow-inner" />
                        <p class="text-[10px] font-bold text-zinc-400 px-1">Introduza até 9 dígitos. O formato será 123 456 789.</p>'''

          if new in text:
              print('NIF input already formatted.')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('NIF input patched.')
          else:
              raise SystemExit('Business profile NIF input block not found.')
          PY

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/business-settings.blade.php .github/workflows/format-business-profile-nif.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git rm .github/workflows/format-business-profile-nif.yml
          git add resources/views/livewire/business/business-settings.blade.php
          git commit -m "Format NIF in business profile"
          git push