name: Patch client access resend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add resend access action
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('resources/views/livewire/business/client-hub.blade.php')
          text = path.read_text(encoding='utf-8')

          if 'wire:click="resendPortalAccess({{ $client->id }})"' in text:
              print('Already patched.')
              raise SystemExit(0)

          pattern = re.compile(
              r'(?P<indent>^[ \t]*)<flux:button[^>]*wire:click="generatePortalLink\(\{\{ \$client->id \}\}\)"[^>]*>.*?</flux:button>',
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit('Could not find the Gerar Portal button in client-hub.blade.php.')

          indent = match.group('indent')
          resend = (
              f'{indent}@if($client->email)\n'
              f'{indent}    <flux:button type="button" wire:click="resendPortalAccess({{ $client->id }})" wire:loading.attr="disabled" variant="ghost" size="xs" icon="envelope" class="rounded-xl text-[9px] font-black uppercase tracking-widest text-brand-600 dark:text-brand-400">\n'
              f'{indent}        Reenviar código\n'
              f'{indent}    </flux:button>\n'
              f'{indent}@endif'
          )

          replacement = match.group(0) + '\n' + resend
          path.write_text(text[:match.start()] + replacement + text[match.end():], encoding='utf-8')
          print('View patched successfully.')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          if git diff --quiet -- resources/views/livewire/business/client-hub.blade.php; then
            echo "No view changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-client-resend.yml
          git add resources/views/livewire/business/client-hub.blade.php .github/workflows/patch-client-resend.yml
          git commit -m "Adicionar botão para reenviar acesso do cliente"
          git push
