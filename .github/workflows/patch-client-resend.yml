name: Patch client access resend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix resend button syntax
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/livewire/business/client-hub.blade.php')
          text = path.read_text(encoding='utf-8')
          old = 'wire:click="resendPortalAccess({ $client->id })"'
          new = 'wire:click="resendPortalAccess({{ $client->id }})"'

          if old not in text:
              print('Resend button syntax is already correct or not present.')
              raise SystemExit(0)

          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Resend button syntax fixed.')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          if git diff --quiet -- resources/views/livewire/business/client-hub.blade.php; then
            echo "No view changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-client-resend.yml
          git add resources/views/livewire/business/client-hub.blade.php .github/workflows/patch-client-resend.yml
          git commit -m "Corrigir botão de reenvio de acesso"
          git push
