name: Optimize dashboard N+1 queries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Dashboard bank account queries
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/Livewire/Dashboard.php')
          s = p.read_text(encoding='utf-8')

          old_total = '''                $baseBalance = (float) BankAccount::where('workspace_id', $currentWs->id)
                    ->sum('balance');

                $incomeBalance = (float) Income::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                $expenseBalance = (float) Expense::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                return $baseBalance + $incomeBalance - $expenseBalance;'''

          new_total = '''                $baseBalance = (float) BankAccount::where('workspace_id', $currentWs->id)
                    ->where('include_in_total', true)
                    ->sum('balance');

                $incomeBalance = (float) Income::where('workspace_id', $currentWs->id)
                    ->where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                $expenseBalance = (float) Expense::where('workspace_id', $currentWs->id)
                    ->where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->sum('amount');

                $recurringDue = (float) \App\Models\RecurringIncome::where('workspace_id', $currentWs->id)
                    ->whereNotNull('bank_account_id')
                    ->where('is_active', true)
                    ->where('day_of_month', '<=', now()->day)
                    ->sum('amount');

                return $baseBalance + $incomeBalance - $expenseBalance + $recurringDue;'''

          if old_total not in s:
              raise SystemExit('total bank balance block not found')
          s = s.replace(old_total, new_total, 1)

          old_top = '''fn () => BankAccount::where('workspace_id', $currentWs->id)
                ->get()
                ->sortByDesc(fn ($account) => $account->current_balance)
                ->take(3)
                ->map(fn ($account) => [
                    'name' => $account->name,
                    'balance' => $account->current_balance,
                    'icon' => $account->getIcon(),
                    'color' => $account->color ?? '#6366f1',
                ])
                ->values()
                ->all()'''

          new_top = '''fn () => BankAccount::where('workspace_id', $currentWs->id)
                ->withSum('incomes', 'amount')
                ->withSum('expenses', 'amount')
                ->withSum(['recurringIncomes' => fn ($query) => $query
                    ->where('is_active', true)
                    ->where('day_of_month', '<=', now()->day)], 'amount')
                ->get(['id', 'name', 'balance', 'color', 'icon'])
                ->map(fn ($account) => [
                    'name' => $account->name,
                    'balance' => (float) $account->balance
                        + (float) ($account->incomes_sum_amount ?? 0)
                        - (float) ($account->expenses_sum_amount ?? 0)
                        + (float) ($account->recurring_incomes_sum_amount ?? 0),
                    'icon' => $account->getIcon(),
                    'color' => $account->color ?? '#6366f1',
                ])
                ->sortByDesc('balance')
                ->take(3)
                ->values()
                ->all()'''

          if old_top not in s:
              raise SystemExit('top bank accounts block not found')
          s = s.replace(old_top, new_top, 1)

          old_services = '''        $financeScore = app(FinanceScoreService::class)->calculate($currentWs);
        $wellnessInsights = app(WellnessFinanceService::class)->getInsights($currentWs);
        $storeEntitlements = app(StoreEntitlementService::class);'''

          new_services = '''        $financeScore = Cache::remember(
            "dashboard:finance-score:{$currentWs->id}",
            60,
            fn () => app(FinanceScoreService::class)->calculate($currentWs)
        );

        $wellnessInsights = Cache::remember(
            "dashboard:wellness:{$currentWs->id}",
            60,
            fn () => app(WellnessFinanceService::class)->getInsights($currentWs)
        );

        $storeEntitlements = app(StoreEntitlementService::class);
        $hasMarketWidget = Cache::remember(
            "dashboard:entitlement:market:{$user->id}",
            60,
            fn () => $storeEntitlements->hasWidget($user, 'mercado-global') || $user->isStar()
        );
        $ownedStoreSlugs = Cache::remember(
            "dashboard:entitlements:{$user->id}",
            60,
            fn () => $storeEntitlements->ownedSlugs($user)
        );'''

          if old_services not in s:
              raise SystemExit('service block not found')
          s = s.replace(old_services, new_services, 1)

          s = s.replace("'hasWidgetMercado' => $storeEntitlements->hasWidget($user, 'mercado-global') || $user->isStar(),", "'hasWidgetMercado' => $hasMarketWidget,", 1)
          s = s.replace("'ownedStoreSlugs' => $storeEntitlements->ownedSlugs($user),", "'ownedStoreSlugs' => $ownedStoreSlugs,", 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate PHP syntax
        run: php -l app/Livewire/Dashboard.php

      - name: Commit optimization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Livewire/Dashboard.php
          git diff --cached --quiet && { echo 'No changes needed'; exit 0; }
          git commit -m 'perf: optimize dashboard queries'
          git push origin main

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/optimize-dashboard-n-plus-one.yml || true
          git commit -m 'chore: remove temporary dashboard optimizer' || true
          git push origin main || true
