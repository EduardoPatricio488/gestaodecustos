name: Fix Business Hub and Plans Sidebar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Professionalize business sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/views/components/layouts/app.blade.php')
          text = path.read_text(encoding='utf-8')
          start = text.find('@elseif($isBusinessMode)')
          end = text.find('@else', start)
          if start == -1 or end == -1:
              raise SystemExit('Business sidebar markers not found')
          block = r'''@elseif($isBusinessMode)
    {{-- MENU EMPRESARIAL --}}

    @if(session()->has('viewing_as_collaborator_id'))
        <flux:sidebar.item icon="arrow-uturn-left" wire:click="stopViewingAsCollaborator" class="text-red-500 font-black cursor-pointer">Sair da Vista do Colaborador</flux:sidebar.item>
    @else
        <flux:sidebar.item icon="arrow-left-circle" :href="route('hub.business.exit')" class="text-zinc-500 font-bold" wire:navigate>Voltar ao Espaço Pessoal</flux:sidebar.item>
    @endif

    <flux:separator class="my-4 mx-2" />

    @if($isManager)
        <flux:sidebar.item icon="chart-pie" :href="route('hub.business.dashboard')" :current="request()->routeIs('hub.business.dashboard')" wire:navigate.hover class="!bg-brand-50 !text-brand-700 dark:!bg-brand-500/15 dark:!text-brand-300 !font-black !rounded-2xl !shadow-sm !border !border-brand-200/70 dark:!border-brand-500/20 !py-3 !px-3 hover:!bg-brand-100 dark:hover:!bg-brand-500/20 transition-all duration-200">Dashboard Business</flux:sidebar.item>

        <flux:sidebar.group heading="Financeiro" class="mt-4">
            <flux:sidebar.item icon="banknotes" :href="route('company-expenses')" :current="request()->routeIs('company-expenses')" wire:navigate.hover>Custos Operacionais {!! $badge($counts['company_expenses']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="document-text" :href="route('hub.business.invoices')" :current="request()->routeIs('hub.business.invoices')" wire:navigate.hover>Faturação & Vendas {!! $badge($counts['invoices']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="building-library" :href="route('hub.business.accounts')" :current="request()->routeIs('hub.business.accounts')" wire:navigate.hover>Contas Bancárias {!! $badge($counts['accounts'] ?? 0) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="chart-bar" :href="route('hub.business.cashflow')" :current="request()->routeIs('hub.business.cashflow')" wire:navigate.hover>Fluxo de Caixa</flux:sidebar.item>
            <flux:sidebar.item icon="presentation-chart-line" :href="route('hub.business.pnl')" :current="request()->routeIs('hub.business.pnl')" wire:navigate.hover>Resultados (P&L)</flux:sidebar.item>
            <flux:sidebar.item icon="receipt-percent" :href="route('hub.business.taxes')" :current="request()->routeIs('hub.business.taxes')" wire:navigate.hover>Impostos & IVA</flux:sidebar.item>
            <flux:sidebar.item icon="document-check" :href="route('hub.business.at-invoices')" :current="request()->routeIs('hub.business.at-invoices')" wire:navigate.hover>e-Fatura AT {!! $badge($counts['at_invoices']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="clipboard-document-check" :href="route('hub.business.expense-approvals')" :current="request()->routeIs('hub.business.expense-approvals')" wire:navigate.hover>Aprovações {!! $badge($counts['expense_approvals']) !!}</flux:sidebar.item>
        </flux:sidebar.group>

        <flux:sidebar.group heading="Comercial & Operações" class="mt-4">
            <flux:sidebar.item icon="user-group" :href="route('hub.business.clients')" :current="request()->routeIs('hub.business.clients')" wire:navigate.hover>Clientes & CRM {!! $badge($counts['clients']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="newspaper" :href="route('hub.business.proposals')" :current="request()->routeIs('hub.business.proposals')" wire:navigate.hover>Propostas {!! $badge($counts['proposals']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="briefcase" :href="route('hub.business.projects')" :current="request()->routeIs('hub.business.projects')" wire:navigate.hover>Projetos {!! $badge($counts['projects']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="truck" :href="route('hub.business.suppliers')" :current="request()->routeIs('hub.business.suppliers')" wire:navigate.hover>Fornecedores {!! $badge($counts['suppliers']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="archive-box" :href="route('hub.business.inventory')" :current="request()->routeIs('hub.business.inventory')" wire:navigate.hover>Stock & Inventário {!! $badge($counts['inventory']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="building-office-2" :href="route('hub.business.costs')" :current="request()->routeIs('hub.business.costs')" wire:navigate.hover>Análise de Custos</flux:sidebar.item>
            <flux:sidebar.item icon="folder-open" :href="route('hub.business.vault')" :current="request()->routeIs('hub.business.vault')" wire:navigate.hover>Arquivo Digital {!! $badge($counts['vault']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="sparkles" :href="route('hub.business.ai')" :current="request()->routeIs('hub.business.ai')" wire:navigate.hover class="text-brand-600 dark:text-brand-400 font-bold">IA Estrategista</flux:sidebar.item>
        </flux:sidebar.group>

        <flux:sidebar.group heading="Equipa & Pessoas" class="mt-4">
            <flux:sidebar.item icon="users" :href="route('hub.business.team')" :current="request()->routeIs('hub.business.team')" wire:navigate.hover>Equipa {!! $badge($counts['employees']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="check-badge" :href="route('hub.business.tasks')" :current="request()->routeIs('hub.business.tasks')" wire:navigate.hover>Tarefas {!! $badge($counts['tasks']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="command-line" :href="route('hub.business.timeline')" :current="request()->routeIs('hub.business.timeline')" wire:navigate.hover>Timeline</flux:sidebar.item>
            <flux:sidebar.item icon="calendar-days" :href="route('hub.business.calendar')" :current="request()->routeIs('hub.business.calendar')" wire:navigate.hover>Calendário</flux:sidebar.item>
            <flux:sidebar.item icon="clock" :href="route('hub.business.absences')" :current="request()->routeIs('hub.business.absences')" wire:navigate.hover>Férias & Ausências {!! $badge($counts['absences']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="user-plus" :href="route('hub.business.recruitment')" :current="request()->routeIs('hub.business.recruitment')" wire:navigate.hover>Recrutamento</flux:sidebar.item>
            <flux:sidebar.item icon="chat-bubble-left-right" :href="route('hub.business.messenger')" :current="request()->routeIs('hub.business.messenger')" wire:navigate.hover>Messenger {!! $badge($counts['messenger']) !!}</flux:sidebar.item>
        </flux:sidebar.group>

        <flux:sidebar.group heading="Suporte & Configuração" class="mt-4">
            <flux:sidebar.item icon="chat-bubble-left-right" :href="route('hub.business.support')" :current="request()->routeIs('hub.business.support')" wire:navigate.hover>Suporte Técnico {!! $badge($counts['support']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="adjustments-horizontal" :href="route('hub.business.settings')" :current="request()->routeIs('hub.business.settings')" wire:navigate.hover>Perfil do Negócio</flux:sidebar.item>
        </flux:sidebar.group>
    @else
        <flux:sidebar.item icon="home" :href="route('hub.business.dashboard')" :current="request()->routeIs('hub.business.dashboard')" wire:navigate.hover>Meu Terminal</flux:sidebar.item>
        <flux:sidebar.group heading="O Meu Trabalho" class="mt-4">
            <flux:sidebar.item icon="check-badge" :href="route('hub.business.tasks')" :current="request()->routeIs('hub.business.tasks')" wire:navigate.hover>As Minhas Tarefas {!! $badge($counts['tasks']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="briefcase" :href="route('hub.business.projects')" :current="request()->routeIs('hub.business.projects')" wire:navigate.hover>Os Meus Projetos {!! $badge($counts['projects']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="banknotes" :href="route('hub.business.my-expenses')" :current="request()->routeIs('hub.business.my-expenses')" wire:navigate.hover>Notas de Gastos {!! $badge($counts['expense_approvals']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="calendar-days" :href="route('hub.business.calendar')" :current="request()->routeIs('hub.business.calendar')" wire:navigate.hover>Calendário</flux:sidebar.item>
        </flux:sidebar.group>
        <flux:sidebar.group heading="Comunicação" class="mt-4">
            <flux:sidebar.item icon="chat-bubble-left-right" :href="route('hub.business.messenger')" :current="request()->routeIs('hub.business.messenger')" wire:navigate.hover>Messenger da Equipa {!! $badge($counts['messenger']) !!}</flux:sidebar.item>
        </flux:sidebar.group>
        <flux:sidebar.group heading="Recursos" class="mt-4">
            <flux:sidebar.item icon="identification" :href="route('hub.business.my-profile')" :current="request()->routeIs('hub.business.my-profile')" wire:navigate.hover>A Minha Ficha</flux:sidebar.item>
            <flux:sidebar.item icon="clock" :href="route('hub.business.absences')" :current="request()->routeIs('hub.business.absences')" wire:navigate.hover>Férias & Ausências {!! $badge($counts['absences']) !!}</flux:sidebar.item>
            <flux:sidebar.item icon="chat-bubble-left-right" :href="route('hub.business.support')" :current="request()->routeIs('hub.business.support')" wire:navigate.hover>Suporte Interno</flux:sidebar.item>
        </flux:sidebar.group>
    @endif

'''
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate business routes and views
        run: |
          if [ -f artisan ]; then
            php artisan route:list --name=hub.business --no-ansi
            php artisan view:cache --no-ansi
            php artisan view:clear --no-ansi
          fi
          grep -q 'heading="Financeiro"' resources/views/components/layouts/app.blade.php
          grep -q 'heading="Comercial & Operações"' resources/views/components/layouts/app.blade.php
          grep -q 'heading="Equipa & Pessoas"' resources/views/components/layouts/app.blade.php

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          if git diff --cached --quiet; then
            echo "No sidebar changes needed."
            exit 0
          fi
          git commit -m "Professionalize business sidebar navigation"
          git push
