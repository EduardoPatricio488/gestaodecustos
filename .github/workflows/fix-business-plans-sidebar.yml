name: Fix Business Hub and Plans Sidebar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/components/layouts/app.blade.php')
          text = path.read_text(encoding='utf-8')

          marker = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))"
          if marker in text:
              print('Sidebar patch already present.')
              raise SystemExit(0)

          start_marker = '<flux:sidebar.nav>'
          end_marker = '</flux:sidebar.nav>'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Opening sidebar nav not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Closing sidebar nav not found')

          inner_start = start + len(start_marker)
          inner = text[inner_start:end]

          block = '''\n            @if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))
                <div class="px-2 py-4">
                    @if($allBusinessWs->count() > 0)
                        <div class="space-y-1">
                            @foreach($allBusinessWs as $ws)
                                <flux:sidebar.item
                                    icon="building-office-2"
                                    :href="route('workspace.switch.fast', $ws->id)"
                                    wire:navigate
                                    class="text-[11px] font-bold py-2"
                                >
                                    {{ $ws->name }}
                                </flux:sidebar.item>
                            @endforeach
                        </div>
                    @else
                        <div class="rounded-2xl border border-dashed border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50 p-4 text-center">
                            <flux:icon name="building-office-2" class="size-7 mx-auto text-zinc-300 dark:text-zinc-700 mb-2" />
                            <p class="text-[10px] font-black uppercase text-zinc-500 dark:text-zinc-400">Não tens nenhuma empresa</p>
                        </div>
                    @endif
                </div>
            @else'''

          replacement = start_marker + block + inner + '\n            @endif\n        ' + end_marker
          text = text[:start] + replacement + text[end + len(end_marker):]
          path.write_text(text, encoding='utf-8')
          print('Sidebar patched successfully.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Limit Business Hub and Plans sidebar to companies"
          git push
