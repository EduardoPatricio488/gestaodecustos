name: Fix Business Hub and Plans Sidebar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/components/layouts/app.blade.php')
          text = path.read_text(encoding='utf-8')

          old = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing') || request()->routeIs('empresa.onboarding'))"
          new = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))"

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Onboarding removed from Business Hub/Plans sidebar condition.')
          else:
              print('Onboarding sidebar condition already corrected or not present.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Show only companies in onboarding sidebar"
          git push
