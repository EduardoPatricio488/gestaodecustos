name: Safe Dashboard PostgreSQL Repair

on:
  push:
    branches:
      - repair-dashboard-safe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Dashboard.php
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/Livewire/Dashboard.php')
          text = path.read_text(encoding='utf-8')

          old = '''        $driver = DB::connection()->getDriverName();
        $expenseMonth = $driver === 'sqlite' ? "strftime('%Y-%m', spent_at)" : "DATE_FORMAT(spent_at, '%Y-%m')";
        $incomeMonth = $driver === 'sqlite' ? "strftime('%Y-%m', received_at)" : "DATE_FORMAT(received_at, '%Y-%m')";'''

          new = '''        $driver = DB::connection()->getDriverName();

        $expenseMonth = match ($driver) {
            'sqlite' => "strftime('%Y-%m', spent_at)",
            'pgsql' => "TO_CHAR(spent_at, 'YYYY-MM')",
            default => "DATE_FORMAT(spent_at, '%Y-%m')",
        };

        $incomeMonth = match ($driver) {
            'sqlite' => "strftime('%Y-%m', received_at)",
            'pgsql' => "TO_CHAR(received_at, 'YYYY-MM')",
            default => "DATE_FORMAT(received_at, '%Y-%m')",
        };'''

          if old not in text:
              raise SystemExit('Expected Dashboard.php block was not found; refusing to modify the file.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP
        run: php -l app/Livewire/Dashboard.php

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php
          git commit -m "fix: support PostgreSQL dashboard month aggregation" || exit 0
          git push origin repair-dashboard-safe
