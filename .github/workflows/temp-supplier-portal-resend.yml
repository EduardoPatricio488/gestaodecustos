name: Temporary Supplier Portal UI Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch supplier portal actions
        shell: python
        run: |
          from pathlib import Path
          p = Path('resources/views/livewire/business/supplier-hub.blade.php')
          s = p.read_text(encoding='utf-8')
          old = '''<button type="button" wire:click="generatePortalLink({{ $supplier->id }})" @click="optionsOpen = false"
    class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-[11px] font-black uppercase text-zinc-600 dark:text-zinc-300 hover:bg-zinc-50 transition-all">
    <flux:icon name="link" class="size-4 text-zinc-400" />
    Gerar Portal
</button>'''
          new = '''<button type="button" wire:click="generatePortalLink({{ $supplier->id }})" @click="optionsOpen = false"
    class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-[11px] font-black uppercase text-zinc-600 dark:text-zinc-300 hover:bg-zinc-50 transition-all">
    <flux:icon name="link" class="size-4 text-zinc-400" />
    Gerar Portal
</button>
@if($supplier->email)
<button type="button" wire:click="resendPortalAccess({{ $supplier->id }})" wire:loading.attr="disabled" @click="optionsOpen = false"
    class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-[11px] font-black uppercase text-brand-600 dark:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-all">
    <flux:icon name="envelope" class="size-4" />
    Reenviar código
</button>
@endif'''
          if old not in s:
              raise SystemExit('Expected supplier portal button block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/supplier-hub.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Add supplier portal code resend action"
          git push