name: Format Company NIF on Business Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Format NIF under company title
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/livewire/business/business-dashboard.blade.php')
          text = path.read_text(encoding='utf-8')

          old = '''                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3">
                        <p class="text-xs font-black text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                            <flux:icon name="identification" class="size-3" /> NIF: <span :class="privacyMode ? 'blur-sm select-none' : ''">{{ $workspace->tax_number ?? 'S/ NIF' }}</span>
                        </p>
                        <span class="text-zinc-300 dark:text-zinc-800">|</span>
                        <p class="text-xs font-black text-brand-600 dark:text-brand-400 uppercase tracking-widest flex items-center gap-2">
                            <flux:icon name="building-office" class="size-3" /> {{ $workspace->industry ?? 'Gestão de Negócio' }}
                        </p>
                    </div>'''

          new = '''                    <div class="mt-3 space-y-2">
                        <p class="text-xs font-black text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                            <flux:icon name="identification" class="size-3" />
                            NIF:
                            <span :class="privacyMode ? 'blur-sm select-none' : ''">
                                @php
                                    $nif = preg_replace('/\\D/', '', (string) ($workspace->tax_number ?? ''));
                                    $formattedNif = $nif !== '' ? trim(chunk_split($nif, 3, ' ')) : 'S/ NIF';
                                @endphp
                                {{ $formattedNif }}
                            </span>
                        </p>
                        <p class="text-xs font-black text-brand-600 dark:text-brand-400 uppercase tracking-widest flex items-center gap-2">
                            <flux:icon name="building-office" class="size-3" /> {{ $workspace->industry ?? 'Gestão de Negócio' }}
                        </p>
                    </div>'''

          if new in text:
              print('Company NIF formatting already present.')
          elif old not in text:
              raise SystemExit('Business Dashboard company info block not found')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Company NIF formatted successfully.')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/business-dashboard.blade.php .github/workflows/format-company-nif.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git rm .github/workflows/format-company-nif.yml
          git add resources/views/livewire/business/business-dashboard.blade.php
          git commit -m "Format company NIF under dashboard title"
          git push
