name: Audit business modals
on:
  push:
    paths:
      - '.github/workflows/audit-business-modals.yml'
      - '.github/business-modal-audit-trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore supplier view and standardize business modals
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          supplier = Path('resources/views/livewire/business/supplier-hub.blade.php')
          original = subprocess.check_output([
              'git','show','e4dc6496983afa10843c303390160c0ef9ecb85e:resources/views/livewire/business/supplier-hub.blade.php'
          ]).decode()
          original = original.replace('wire:model="tax_number"', 'wire:model.live="tax_number" inputmode="numeric" maxlength="11" autocomplete="off"', 1)
          supplier.write_text(original, encoding='utf-8')

          modal = Path('resources/views/flux/modal/index.blade.php')
          text = modal.read_text(encoding='utf-8')
          text = text.replace(
              "default => 'p-6 [:where(&)]:max-w-xl [:where(&)]:min-w-xs shadow-lg rounded-xl',",
              "default => 'fixed inset-0 m-auto max-h-[90vh] overflow-y-auto p-6 [:where(&)]:max-w-xl [:where(&)]:min-w-xs shadow-lg rounded-xl',"
          )
          text = text.replace('<div class="absolute top-0 end-0 mt-4 me-4">', '<div class="absolute top-4 end-4 z-50">')
          modal.write_text(text, encoding='utf-8')

          js = Path('resources/js/app.js')
          app = js.read_text(encoding='utf-8')
          marker = '// Global business field formatting.'
          if marker not in app:
              app += '''\n\n// Global business field formatting.\n(function () {\n    const digits = (v) => (v || '').replace(/\\D/g, '');\n    const groups = (v, sizes) => {\n        const raw = digits(v).slice(0, sizes.reduce((a,b) => a+b, 0));\n        const parts = []; let i = 0;\n        for (const size of sizes) { if (i >= raw.length) break; parts.push(raw.slice(i, i + size)); i += size; }\n        return parts.join(' ');\n    };\n    const apply = (input) => {\n        if (!(input instanceof HTMLInputElement) || ['password','email','hidden','number'].includes(input.type)) return;\n        const text = `${input.closest('div')?.innerText || ''} ${input.getAttribute('aria-label') || ''} ${input.getAttribute('placeholder') || ''}`.toLowerCase();\n        let value = null;\n        if (/\\b(nif|vat|tax id|tax number)\\b/.test(text)) value = groups(input.value,[3,3,3]);\n        else if (/\\b(iban)\\b/.test(text)) value = groups(input.value,[4,4,4,4,4,3]);\n        else if (/\\b(telem[oó]vel|telefone|phone|contacto telef[oó]nico|mobile)\\b/.test(text)) value = groups(input.value,[3,3,3]);\n        else if (/\\b(c[oó]digo postal|postal code|zip)\\b/.test(text)) value = groups(input.value,[4,3]);\n        if (value !== null && value !== input.value) { input.value = value; input.dispatchEvent(new Event('input',{bubbles:true})); }\n    };\n    document.addEventListener('input', e => apply(e.target), true);\n    document.addEventListener('focusin', e => apply(e.target), true);\n    document.addEventListener('livewire:navigated', () => document.querySelectorAll('input').forEach(apply));\n})();\n'''
              js.write_text(app, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/livewire/business/supplier-hub.blade.php resources/views/flux/modal/index.blade.php resources/js/app.js
          git commit -m 'Restore supplier hub and standardize business modals' || exit 0
          git push
