name: Fix Client Portal Modal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-modal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy supplier portal modal design to clients
        shell: python
        run: |
          from pathlib import Path
          import re

          client_path = Path('resources/views/livewire/business/client-hub.blade.php')
          supplier_path = Path('resources/views/livewire/business/supplier-hub.blade.php')
          client = client_path.read_text(encoding='utf-8')
          supplier = supplier_path.read_text(encoding='utf-8')

          match = re.search(r'(<flux:modal name="supplier-portal-modal"[\s\S]*?</flux:modal>)', supplier)
          if not match:
              raise SystemExit('Supplier portal modal not found')

          modal = match.group(1)
          modal = modal.replace('supplier-portal-modal', 'portal-link-modal')
          modal = modal.replace('Chave de Parceiro', 'Chave de Acesso')
          modal = modal.replace('Credenciais para o Portal do Fornecedor.', 'Geração de credenciais únicas para o cliente.')
          modal = modal.replace('Portal do Fornecedor', 'Portal do Cliente')
          modal = modal.replace('{{ $supplierTaxNumber }}', "{{ $clientTaxNumber ? implode(' ', str_split(preg_replace('/\\D/', '', (string) $clientTaxNumber), 3)) : '---' }}")
          modal = modal.replace('{{ $generatedPortalUrl }}', "{{ route('client.login') }}")
          modal = modal.replace('Usar Código:', 'Usar a Chave Única:')
          modal = modal.replace('Introduzir NIF:', 'Introduzir o NIF:')
          modal = modal.replace('Aceder a:', 'Aceder ao endereço:')

          start_marker = '    {{-- 5. MODAL: ACESSO AO PORTAL COM CÓDIGO ÚNICO --}}'
          start = client.find(start_marker)
          end_marker = '    {{-- 6. MODAL: HISTÓRICO INTEGRADO DO CLIENTE --}}'
          end = client.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Client portal modal block not found')

          replacement = '    {{-- 5. MODAL: ACESSO AO PORTAL DO CLIENTE --}}\n' + modal + '\n\n'
          client_path.write_text(client[:start] + replacement + client[end:], encoding='utf-8')

      - name: Remove old client-specific modal CSS overrides
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('resources/css/app.css')
          css = path.read_text(encoding='utf-8')

          css = re.sub(
              r'\n/\* ─── CLIENTE: PORTAL DE ACESSO — CORREÇÃO DEFINITIVA ─────────────── \*/[\s\S]*?(?=\n/\*|\Z)',
              '\n', css, count=1
          )
          css = re.sub(
              r'\n/\* ─── CLIENTES: MODAL DE CHAVE DE ACESSO ───────────────────────────── \*/[\s\S]*?(?=\n/\*|\Z)',
              '\n', css, count=1
          )
          path.write_text(css, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/client-hub.blade.php resources/css/app.css
          git rm .github/workflows/fix-client-portal-modal.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: match client portal modal to supplier portal"
          git push
