name: Apply bank access UI fix
on:
  push:
    paths:
      - '.github/workflows/fix-bank-audit-access.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bank token share action
        shell: python
        run: |
          from pathlib import Path
          p=Path('resources/views/livewire/business/bank-account-hub.blade.php')
          s=p.read_text()
          s=s.replace("navigator.clipboard.writeText('http://localhost:8000/portal/banco'); copiedPortal = true", "navigator.clipboard.writeText('{{ $generatedAuditCode }}'); copiedPortal = true")
          s=s.replace("copiedPortal ? 'Link Copiado!' : 'Partilhar Token'", "copiedPortal ? 'Token Copiado!' : 'Partilhar Token'")
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/views/livewire/business/bank-account-hub.blade.php
          git commit -m "Fix bank token sharing" || exit 0
          git push
