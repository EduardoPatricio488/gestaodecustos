name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Fix client portal modal CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/css/app.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* ─── CLIENTE: PORTAL COM O MESMO COMPORTAMENTO DO FORNECEDOR ─────── */'
          start = css.find(marker)

          if start == -1:
              raise SystemExit('Portal modal CSS marker not found')

          replacement = r'''/* ─── CLIENTE: PORTAL DE ACESSO — DIMENSÃO DESKTOP PROFISSIONAL ───── */
/* Modal de gerar acesso do cliente: largo, legível e responsivo. */
dialog[data-modal="portal-link-modal"] {
    box-sizing: border-box !important;
    width: min(800px, calc(100vw - 2rem)) !important;
    max-width: 800px !important;
    max-height: 90vh !important;
    margin: auto !important;
    padding: 0 !important;
    overflow: hidden !important;
    border-radius: 2rem !important;
}

dialog[data-modal="portal-link-modal"] > div:first-child {
    position: relative !important;
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: none !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    padding: 2.5rem !important;
    border-radius: 2rem !important;
    background: #fff !important;
}

.dark dialog[data-modal="portal-link-modal"] > div:first-child {
    background: #09090b !important;
}

dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child {
    display: flex !important;
    align-items: flex-start !important;
    width: 100% !important;
    min-width: 0 !important;
    gap: 1rem !important;
    padding-right: 3rem !important;
}

dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child > div:nth-child(2) {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    width: auto !important;
}

dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child h1,
dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child h2,
dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child h3 {
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
}

dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child ui-close,
dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child [data-flux-modal-close] {
    position: absolute !important;
    top: 1.25rem !important;
    right: 1.25rem !important;
    z-index: 50 !important;
}

dialog[data-modal="portal-link-modal"] > div:first-child > div:nth-child(2) {
    width: 100% !important;
    max-width: none !important;
    min-width: 0 !important;
    margin-top: 1.5rem !important;
}

dialog[data-modal="portal-link-modal"] .text-5xl {
    font-size: 3.75rem !important;
    line-height: 1 !important;
    letter-spacing: 0.18em !important;
}

dialog[data-modal="portal-link-modal"] a,
dialog[data-modal="portal-link-modal"] p,
dialog[data-modal="portal-link-modal"] span,
dialog[data-modal="portal-link-modal"] code {
    overflow-wrap: anywhere !important;
    word-break: break-word !important;
}

dialog[data-modal="portal-link-modal"] input,
dialog[data-modal="portal-link-modal"] textarea {
    width: 100% !important;
    max-width: 100% !important;
}

@media (min-width: 641px) {
    dialog[data-modal="portal-link-modal"] > div:first-child {
        min-width: 760px !important;
    }
}

@media (max-width: 640px) {
    dialog[data-modal="portal-link-modal"] {
        width: calc(100vw - 1rem) !important;
        max-width: calc(100vw - 1rem) !important;
        max-height: 94vh !important;
        border-radius: 1.5rem !important;
    }

    dialog[data-modal="portal-link-modal"] > div:first-child {
        min-width: 0 !important;
        max-height: 94vh !important;
        padding: 1.25rem !important;
        border-radius: 1.5rem !important;
    }

    dialog[data-modal="portal-link-modal"] > div:first-child > div:first-child {
        padding-right: 2.75rem !important;
    }

    dialog[data-modal="portal-link-modal"] .text-5xl {
        font-size: 2.5rem !important;
        letter-spacing: 0.12em !important;
    }
}
'''

          path.write_text(css[:start] + replacement, encoding='utf-8')

      - name: Run Pint
        run: composer lint

      - name: Commit formatted PHP files and CSS
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z -- '*.php' '*.css' | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No formatting or CSS changes to commit."
            exit 0
          fi
          git commit -m "fix: resize client portal access modal"
          git push
