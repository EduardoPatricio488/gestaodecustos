name: Apply dashboard performance optimizations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe dashboard optimizations
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/Livewire/Dashboard.php")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = {
              "Cache::remember('market_prices_all', 60, function () {":
                  "Cache::flexible('market_prices_all', [300, 1800], function () {",
              "Cache::remember(\"dashboard:notifications-checked:{$user->id}:\".now()->toDateString(), now()->endOfDay(), function () use ($user) {":
                  "Cache::flexible(\"dashboard:notifications-checked:{$user->id}:\".now()->toDateString(), [3600, 86400], function () use ($user) {",
              "fn () => BankAccount::where('workspace_id', $currentWs->id)->get()->sum(fn ($account) => $account->current_balance)":
                  "fn () => (float) BankAccount::where('workspace_id', $currentWs->id)->sum('current_balance')",
              "fn () => BankAccount::where('workspace_id', $currentWs->id)->get()\n                ->sortByDesc(fn ($account) => $account->current_balance)\n                ->take(3)":
                  "fn () => BankAccount::where('workspace_id', $currentWs->id)\n                ->orderByDesc('current_balance')\n                ->take(3)",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected dashboard pattern not found: {old[:100]}")
              text = text.replace(old, new, 1)

          method_start = "    #[Computed]\n    public function aiInsights()\n    {"
          next_method = "\n    private function fetchData360"
          start = text.find(method_start)
          end = text.find(next_method, start)
          if start == -1 or end == -1:
              raise SystemExit("Could not locate aiInsights method boundaries")

          method = text[start:end]
          guard = "        $user = auth()->user();\n        $currentWs = $user->currentWorkspace;\n        if (! $currentWs) {\n            return [];\n        }\n"
          if guard not in method:
              raise SystemExit("aiInsights guard not found")

          method = method.replace(guard, "        $user = auth()->user();\n        $currentWs = $user->currentWorkspace;\n        if (! $currentWs) {\n            return [];\n        }\n\n        return Cache::flexible(\n            \"dashboard:ai-insights:{$currentWs->id}:\".now()->format('Y-m'),\n            [120, 600],\n            function () use ($currentWs) {\n", 1)

          closing = "        return $insights;\n    }\n"
          if closing not in method:
              raise SystemExit("aiInsights closing block not found")
          method = method.replace(closing, "        return $insights;\n            }\n        );\n    }\n", 1)

          text = text[:start] + method + text[end:]

          if text == original:
              raise SystemExit("No dashboard changes were produced")

          path.write_text(text, encoding="utf-8")

      - name: Validate PHP syntax
        run: php -l app/Livewire/Dashboard.php

      - name: Commit optimized dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize dashboard external data and heavy queries"
          git push
