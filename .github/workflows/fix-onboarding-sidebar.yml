name: Fix Onboarding Sidebar

on:
  push:
    paths:
      - '.github/workflows/fix-onboarding-sidebar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch onboarding sidebar
        shell: python
        run: |
          from pathlib import Path
          path = Path('resources/views/components/layouts/app.blade.php')
          text = path.read_text(encoding='utf-8')
          old = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing') || request()->routeIs('empresa.onboarding'))"
          new = "@if(request()->routeIs('hub.business.gateway') || request()->routeIs('hub.pricing'))"
          if old not in text:
              raise SystemExit('Expected sidebar condition not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          git commit -m "Show only companies in onboarding sidebar"
          git push
