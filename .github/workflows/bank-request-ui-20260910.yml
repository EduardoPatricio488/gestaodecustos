name: Add company bank request approval UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add bank request UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('resources/views/livewire/business/bank-account-hub.blade.php')
          s = p.read_text(encoding='utf-8')

          button = '<div class="mb-5 flex justify-end"><button type="button" wire:click="generateAuditCode"'
          marker = "{{-- 3. LISTAGEM DE CONTAS — DOSSIÊ EXECUTIVO (VERSÃO FINAL COM MENU 3 PONTOS) --}}"
          modal_marker = "{{-- MODAL: CREDENCIAIS DE AUDITORIA BANCÁRIA --}}"

          if 'Pedidos de acesso bancário pendentes' not in s:
              idx = s.find(marker)
              if idx == -1:
                  raise SystemExit('Bank account list marker not found')
              panel = r'''

@if($isBusinessMode && $bankAccessRequests->count())
    <div class="mb-6 rounded-[2rem] border border-amber-200 bg-amber-50 dark:border-amber-500/20 dark:bg-amber-500/10 p-6 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-start gap-4">
                <div class="size-11 shrink-0 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <flux:icon name="shield-exclamation" class="size-5" />
                </div>
                <div>
                    <p class="text-[9px] font-black uppercase tracking-[0.25em] text-amber-700 dark:text-amber-400">Segurança bancária</p>
                    <h3 class="mt-1 text-lg font-black text-zinc-900 dark:text-white">Pedidos de acesso bancário pendentes</h3>
                    <p class="mt-1 text-xs text-zinc-600 dark:text-zinc-400">Um banco solicitou os dados de auditoria. Confirma a entidade antes de enviar o NIF e o token.</p>
                </div>
            </div>
            <flux:modal.trigger name="bank-request-modal">
                <flux:button variant="primary" icon="envelope" class="rounded-2xl font-black uppercase tracking-widest text-[10px] bg-amber-600 hover:bg-amber-700 border-none shrink-0">
                    Ver pedidos ({{ $bankAccessRequests->count() }})
                </flux:button>
            </flux:modal.trigger>
        </div>
    </div>
@endif
'''
              s = s[:idx] + panel + '\n' + s[idx:]

          if modal_marker not in s:
              raise SystemExit('Audit modal marker not found')

          modal = r'''

{{-- MODAL: PEDIDOS DE ACESSO BANCÁRIO --}}
<flux:modal name="bank-request-modal" position="center" class="!fixed !inset-0 !m-auto w-[calc(100vw-2rem)] md:w-[620px] !h-fit max-h-[90vh] !p-0">
    <div class="relative w-full max-h-[90vh] overflow-y-auto p-7 sm:p-9 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-7 shadow-2xl border border-zinc-200 dark:border-zinc-800 text-left">
        <div class="flex items-start justify-between gap-5">
            <div>
                <p class="text-[9px] font-black uppercase tracking-[0.25em] text-amber-600">Autorização bancária</p>
                <h2 class="mt-1 text-2xl font-black uppercase italic tracking-tighter text-zinc-900 dark:text-white">Pedidos de acesso</h2>
                <p class="mt-2 text-xs text-zinc-500">Só envia as credenciais depois de confirmares que reconheces o banco.</p>
            </div>
            <flux:modal.close>
                <button type="button" class="p-2 text-zinc-400 hover:text-zinc-900 dark:hover:text-white">
                    <flux:icon name="x-mark" class="size-5" />
                </button>
            </flux:modal.close>
        </div>

        <div class="space-y-4">
            @forelse($bankAccessRequests as $bankRequest)
                <div wire:key="bank-request-{{ $bankRequest->id }}" class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 p-5">
                    <div class="flex items-start justify-between gap-4">
                        <div class="min-w-0">
                            <p class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Banco solicitante</p>
                            <h3 class="mt-1 font-black text-base text-zinc-900 dark:text-white">{{ $bankRequest->bank_name }}</h3>
                            <p class="mt-1 text-xs font-semibold text-zinc-500 break-all">{{ $bankRequest->bank_email }}</p>
                            <p class="mt-2 text-[10px] text-zinc-400">Pedido em {{ optional($bankRequest->requested_at)->format('d/m/Y H:i') }}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-700 dark:text-amber-400 text-[8px] font-black uppercase tracking-widest">Pendente</span>
                    </div>

                    <div class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <flux:button wire:click="approveBankAccessRequest({{ $bankRequest->id }})" wire:loading.attr="disabled" wire:target="approveBankAccessRequest({{ $bankRequest->id }})" variant="primary" icon="paper-airplane" class="rounded-xl font-black uppercase text-[9px] tracking-widest">
                            Enviar dados de acesso
                        </flux:button>
                        <flux:button wire:click="rejectBankAccessRequest({{ $bankRequest->id }})" wire:loading.attr="disabled" variant="ghost" icon="x-mark" class="rounded-xl font-black uppercase text-[9px] tracking-widest text-red-600">
                            Recusar pedido
                        </flux:button>
                    </div>
                    <p class="mt-3 text-[9px] text-zinc-400 leading-relaxed">Ao aprovar, o Finance Pro IA envia automaticamente para este email o NIF da empresa e o Token de Auditoria.</p>
                </div>
            @empty
                <div class="py-10 text-center text-xs font-semibold text-zinc-400">Não existem pedidos pendentes.</div>
            @endforelse
        </div>
    </div>
</flux:modal>
'''
          s = s.replace(modal_marker, modal + '\n' + modal_marker, 1)
          p.write_text(s, encoding='utf-8')

          # Improve the visible company-email label in the business profile.
          p2 = Path('resources/views/livewire/business/business-settings.blade.php')
          s2 = p2.read_text(encoding='utf-8')
          s2 = s2.replace('Email de Faturação', 'Email da Empresa', 1)
          p2.write_text(s2, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/bank-account-hub.blade.php resources/views/livewire/business/business-settings.blade.php
          git diff --cached --quiet || git commit -m "Add company bank request approval UI"
          git push
