name: Fix dashboard bank balance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard and migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('app/Livewire/Dashboard.php')
          s = dashboard.read_text()
          s = s.replace("sum('current_balance')", "sum('balance')")
          s = s.replace("orderByDesc('current_balance')", "orderByDesc('balance')")
          s = s.replace("$account->current_balance", "$account->balance")
          dashboard.write_text(s)

          migration = Path('database/migrations/2026_09_11_190000_add_performance_indexes.php')
          if migration.exists():
              migration.write_text(migration.read_text().replace("'current_balance'", "'balance'"))
          PY
      - name: Validate PHP
        run: |
          php -l app/Livewire/Dashboard.php
          php -l database/migrations/2026_09_11_190000_add_performance_indexes.php
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-dashboard-bank-balance.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php database/migrations/2026_09_11_190000_add_performance_indexes.php .github/workflows/fix-dashboard-bank-balance.yml
          git commit -m "Fix dashboard bank balance column" || exit 0
          git push
