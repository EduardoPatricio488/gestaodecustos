name: modal-audit-one-off

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-and-fix:
    if: ${{ !contains(github.event.head_commit.message, '[modal-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global modal system and generate inventory
        shell: python
        run: |
          from pathlib import Path
          import re

          js = r'''// Finance Pro AI — global modal behaviour.
          // Keeps Flux, Livewire and Alpine dialogs consistent without replacing their state management.
          (() => {
              const CLOSE_LABELS = /^(fechar|close|close modal|cancelar|descartar|cancel|discard)$/i;
              const VISIBLE = (el) => {
                  if (!el || !el.isConnected) return false;
                  const style = window.getComputedStyle(el);
                  const rect = el.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0' && rect.width > 0 && rect.height > 0;
              };
              const dialogs = () => Array.from(document.querySelectorAll('[role="dialog"], dialog[open]')).filter(VISIBLE);
              const topDialog = () => dialogs().at(-1) || null;
              const closeButtons = (dialog) => Array.from(dialog.querySelectorAll('button, [role="button"]')).filter((button) => {
                  const label = (button.getAttribute('aria-label') || button.textContent || '').replace(/\\s+/g, ' ').trim();
                  return CLOSE_LABELS.test(label) || button.dataset.modalClose === 'true' || button.classList.contains('finance-pro-modal-close');
              });
              const findExistingTopClose = (dialog) => {
                  const rect = dialog.getBoundingClientRect();
                  return Array.from(dialog.querySelectorAll('button')).find((button) => {
                      if (button.dataset.financeModalInjected === '1') return false;
                      const buttonRect = button.getBoundingClientRect();
                      const text = (button.textContent || '').trim();
                      const label = button.getAttribute('aria-label') || '';
                      const iconOnly = !text && button.querySelector('svg');
                      const nearTopRight = buttonRect.top - rect.top < 110 && rect.right - buttonRect.right < 110;
                      return CLOSE_LABELS.test(label) || (iconOnly && nearTopRight);
                  }) || null;
              };
              const close = (dialog) => {
                  const existing = findExistingTopClose(dialog) || closeButtons(dialog)[0];
                  if (existing) { existing.click(); return; }
                  const name = dialog.getAttribute('data-modal') || dialog.getAttribute('data-name') || dialog.getAttribute('data-modal-name') || dialog.id || '';
                  if (name) window.dispatchEvent(new CustomEvent('modal-close', { detail: { name } }));
                  if (dialog instanceof HTMLDialogElement && dialog.open) dialog.close();
              };
              const ensureDialog = (dialog) => {
                  if (!dialog.hasAttribute('role')) dialog.setAttribute('role', 'dialog');
                  dialog.setAttribute('aria-modal', 'true');
                  const heading = dialog.querySelector('h1,h2,h3,h4,h5,h6');
                  if (heading && !heading.id) heading.id = `finance-pro-modal-title-${Math.random().toString(36).slice(2, 9)}`;
                  if (heading && !dialog.hasAttribute('aria-labelledby')) dialog.setAttribute('aria-labelledby', heading.id);
                  if (!heading && !dialog.hasAttribute('aria-label')) dialog.setAttribute('aria-label', 'Janela de diálogo');

                  let button = findExistingTopClose(dialog);
                  if (!button) {
                      button = document.createElement('button');
                      button.type = 'button';
                      button.dataset.modalClose = 'true';
                      button.dataset.financeModalInjected = '1';
                      button.setAttribute('aria-label', 'Fechar');
                      button.className = 'finance-pro-modal-close';
                      button.innerHTML = '<span aria-hidden="true">&times;</span>';
                      button.addEventListener('click', (event) => { event.preventDefault(); close(dialog); });
                      if (getComputedStyle(dialog).position === 'static') dialog.style.position = 'relative';
                      dialog.prepend(button);
                  } else {
                      button.classList.add('finance-pro-modal-close');
                      if (!button.getAttribute('aria-label')) button.setAttribute('aria-label', 'Fechar');
                  }
              };

              let lastActive = null;
              let hadDialog = false;
              const sync = () => {
                  const activeDialogs = dialogs();
                  activeDialogs.forEach(ensureDialog);
                  if (activeDialogs.length && !hadDialog) {
                      lastActive = document.activeElement instanceof HTMLElement ? document.activeElement : null;
                      const closeButton = findExistingTopClose(activeDialogs.at(-1));
                      (closeButton || activeDialogs.at(-1).querySelector('input,select,textarea,button,[tabindex]:not([tabindex="-1"])'))?.focus({ preventScroll: true });
                  }
                  hadDialog = activeDialogs.length > 0;
                  document.documentElement.classList.toggle('finance-pro-modal-open', activeDialogs.length > 0);
                  if (!activeDialogs.length && lastActive?.isConnected) { lastActive.focus({ preventScroll: true }); lastActive = null; }
              };

              document.addEventListener('keydown', (event) => {
                  if (event.key !== 'Escape') return;
                  const dialog = topDialog();
                  if (!dialog) return;
                  event.preventDefault();
                  event.stopPropagation();
                  close(dialog);
              }, true);

              document.addEventListener('keydown', (event) => {
                  if (event.key !== 'Tab') return;
                  const dialog = topDialog();
                  if (!dialog) return;
                  const focusable = Array.from(dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(VISIBLE);
                  if (!focusable.length) return;
                  const first = focusable[0], last = focusable.at(-1);
                  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
              }, true);

              const observer = new MutationObserver(() => requestAnimationFrame(sync));
              const start = () => {
                  observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class', 'open', 'aria-hidden'] });
                  sync();
              };
              if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true }); else start();
              document.addEventListener('livewire:navigated', () => setTimeout(sync, 50));
              window.addEventListener('modal-show', () => setTimeout(sync, 50));
              window.addEventListener('modal-close', () => setTimeout(sync, 50));
          })();
          '''

          css = r'''/* Finance Pro AI — global modal consistency layer. */
          html.finance-pro-modal-open,
          html.finance-pro-modal-open body { overflow: hidden !important; }

          .finance-pro-modal-close {
              position: absolute !important;
              top: 1rem !important;
              right: 1rem !important;
              z-index: 100 !important;
              display: inline-flex !important;
              width: 2.5rem !important;
              min-width: 2.5rem !important;
              height: 2.5rem !important;
              min-height: 2.5rem !important;
              align-items: center !important;
              justify-content: center !important;
              padding: 0 !important;
              border: 1px solid rgb(228 228 231 / 0.9) !important;
              border-radius: 9999px !important;
              background: rgb(255 255 255 / 0.92) !important;
              color: rgb(113 113 122) !important;
              box-shadow: 0 8px 24px rgb(0 0 0 / 0.08) !important;
              cursor: pointer !important;
              transition: 150ms ease !important;
          }
          .finance-pro-modal-close:hover { background: rgb(244 244 245) !important; color: rgb(24 24 27) !important; transform: scale(1.04); }
          .finance-pro-modal-close:focus-visible { outline: 2px solid rgb(16 185 129) !important; outline-offset: 2px !important; }
          .finance-pro-modal-close span { font-size: 1.5rem; line-height: 1; font-weight: 400; }
          .dark .finance-pro-modal-close { border-color: rgb(63 63 70 / 0.9) !important; background: rgb(24 24 27 / 0.94) !important; color: rgb(161 161 170) !important; }
          .dark .finance-pro-modal-close:hover { background: rgb(39 39 42) !important; color: white !important; }
          @media (max-width: 640px) {
              .finance-pro-modal-close { top: 0.75rem !important; right: 0.75rem !important; width: 2.5rem !important; min-width: 2.5rem !important; height: 2.5rem !important; min-height: 2.5rem !important; }
          }
          '''

          Path('resources/js/modal-system.js').write_text(js, encoding='utf-8')
          Path('resources/css/modal-system.css').write_text(css, encoding='utf-8')

          app_js = Path('resources/js/app.js')
          text = app_js.read_text(encoding='utf-8')
          if "import './modal-system';" not in text:
              text = "import './modal-system';\n" + text
              app_js.write_text(text, encoding='utf-8')

          app_css = Path('resources/css/app.css')
          text = app_css.read_text(encoding='utf-8')
          if "@import './modal-system.css';" not in text:
              text = "@import './modal-system.css';\n" + text
              app_css.write_text(text, encoding='utf-8')

          roots = [Path('resources/views'), Path('resources/views/components')]
          files = sorted({p for root in roots if root.exists() for p in root.rglob('*.blade.php')})
          records = []
          totals = {'flux:modal': 0, 'role=dialog': 0, '<dialog': 0, 'modal-show': 0, 'x-show': 0, 'wire:modal': 0}
          for path in files:
              lines = path.read_text(encoding='utf-8', errors='ignore').splitlines()
              for number, line in enumerate(lines, 1):
                  patterns = []
                  if 'flux:modal' in line: patterns.append('Flux modal'); totals['flux:modal'] += line.count('flux:modal')
                  if 'role="dialog"' in line or "role='dialog'" in line: patterns.append('ARIA dialog'); totals['role=dialog'] += line.count('role="dialog"') + line.count("role='dialog'")
                  if '<dialog' in line: patterns.append('HTML dialog'); totals['<dialog'] += line.count('<dialog')
                  if 'modal-show' in line or 'modal-close' in line: patterns.append('modal event'); totals['modal-show'] += line.count('modal-show') + line.count('modal-close')
                  if 'x-show' in line and ('modal' in line.lower() or 'dialog' in line.lower()): patterns.append('Alpine modal'); totals['x-show'] += 1
                  if 'wire:model' in line and ('modal' in line.lower() or 'dialog' in line.lower()): patterns.append('Livewire state')
                  if patterns: records.append((str(path).replace('\\','/'), number, ', '.join(sorted(set(patterns)))))

          modal_files = sorted({r[0] for r in records})
          report = ['# Finance Pro AI — Modal Audit', '', 'Generated automatically from the repository source.', '', '## Scope', '', 'Scanned all Blade views under `resources/views` for Flux modals, ARIA/HTML dialogs and modal-specific Alpine/Livewire patterns.', '', '## Inventory', '', f'- Blade files scanned: **{len(files)}**', f'- Files containing modal/dialog patterns: **{len(modal_files)}**', f'- `flux:modal` occurrences: **{totals["flux:modal"]}**', f'- `role="dialog"` / `role=\'dialog\'` occurrences: **{totals["role=dialog"]}**', f'- `<dialog>` occurrences: **{totals["<dialog"]}**', f'- Modal event references: **{totals["modal-show"]}**', '', '## Global corrections applied', '', '- Added a single global modal behaviour layer for Flux, Livewire and Alpine dialogs.', '- Standardized a 40x40px minimum close target with `aria-label="Fechar"`.', '- Added Escape-to-close for the topmost visible dialog.', '- Added body scroll locking while a dialog is open.', '- Added focus management and basic keyboard focus trapping.', '- Added automatic dialog semantics (`role="dialog"`, `aria-modal="true"`, title association when possible).', '- Added automatic close-button fallback when a visible dialog has no detectable top-right close control.', '- Added mobile-safe close-button sizing and visible focus states.', '- Kept existing modal state/business logic intact; the global layer delegates closing to the modal’s existing close action whenever available.', '', '## Modal inventory', '', '| Ficheiro | Linha | Mecanismo |', '|---|---:|---|']
          for path, number, mechanism in records:
              report.append(f'| `{path}` | {number} | {mechanism} |')
          report += ['', '## Verification', '', '- Source inventory generated by the same repository checkout used for the changes.', '- `npm run build`, Pint and Pest are left to the repository CI workflow for final verification.', '- Browser/device visual certification still requires an actual browser; this source audit does not claim pixel-perfect certification.']
          Path('docs/MODAL-AUDIT.md').write_text('\n'.join(report) + '\n', encoding='utf-8')

      - name: Commit changes and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/modal-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/modal-system.js resources/css/modal-system.css resources/js/app.js resources/css/app.css docs/MODAL-AUDIT.md .github/workflows/modal-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix and standardize all modals [modal-audit]"
          git push
