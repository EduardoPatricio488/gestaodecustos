name: Fix Audit Portal Address

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace audit portal address
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resources/views/livewire/business/bank-account-hub.blade.php')
          s = p.read_text(encoding='utf-8')
          old = "{{ url('/portal/banco') }}"
          new = "https://gestaodecustos.onrender.com/portal/banco"
          if old not in s:
              raise SystemExit('Audit portal address placeholder not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/bank-account-hub.blade.php
          git diff --cached --quiet || git commit -m "Fix audit portal address"
          git push
