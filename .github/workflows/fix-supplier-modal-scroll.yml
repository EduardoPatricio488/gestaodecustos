name: Center supplier creation modal with scroll

on:
  push:
    paths:
      - '.github/workflows/fix-supplier-modal-scroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update supplier modal layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('resources/views/livewire/business/supplier-hub.blade.php')
          s = p.read_text(encoding='utf-8')
          old = '<flux:modal name="supplier-modal" position="center" class="md:w-[650px] !p-0 overflow-visible">\n        <div class="relative p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-10 shadow-2xl border border-zinc-200 dark:border-zinc-800">'
          new = '<flux:modal name="supplier-modal" position="center" class="w-[calc(100vw-2rem)] max-w-[650px] max-h-[90vh] !p-0 overflow-hidden">\n        <div class="relative max-h-[90vh] overflow-y-auto overscroll-contain p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-10 shadow-2xl border border-zinc-200 dark:border-zinc-800 scrollbar-thin scrollbar-thumb-zinc-300 dark:scrollbar-thumb-zinc-700 scrollbar-track-transparent">'
          if old not in s:
              raise SystemExit('Expected supplier modal block not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/business/supplier-hub.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Center supplier modal and add internal scroll"
          git push
