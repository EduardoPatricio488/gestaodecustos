name: Fix supplier NIF formatting
on:
  push:
    paths:
      - '.github/workflows/fix-supplier-nif.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore supplier view and format NIF
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          path = Path('resources/views/livewire/business/supplier-hub.blade.php')
          original = subprocess.check_output([
              'git', 'show', 'e4dc6496983afa10843c303390160c0ef9ecb85e:resources/views/livewire/business/supplier-hub.blade.php'
          ]).decode('utf-8')
          old = '''                            <flux:input
                                wire:model="tax_number"
                                placeholder="500 000 000"
                                class="font-black !bg-white dark:!bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl h-12 shadow-sm"
                            />'''
          new = '''                            <flux:input
                                wire:model.live="tax_number"
                                placeholder="500 000 000"
                                inputmode="numeric"
                                maxlength="11"
                                autocomplete="off"
                                class="font-black !bg-white dark:!bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl h-12 shadow-sm"
                            />
                            <p class="px-1 text-[9px] font-bold text-zinc-400 uppercase tracking-widest">O NIF é dividido automaticamente em grupos de 3 dígitos.</p>'''
          if old not in original:
              raise SystemExit('Supplier NIF input pattern not found')
          updated = original.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/livewire/business/supplier-hub.blade.php
          git commit -m 'Format supplier NIF input' || exit 0
          git push
