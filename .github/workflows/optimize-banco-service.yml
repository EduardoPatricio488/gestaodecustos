name: Optimize BancoService queries

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize BancoService
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/Services/BancoService.php')
          s = p.read_text(encoding='utf-8')

          old = """class BancoService
          {
              private int $workspaceId;

              public function __construct(int $workspaceId)
              {
                  $this->workspaceId = $workspaceId;
              }
          """
          new = """class BancoService
          {
              private int $workspaceId;
              private ?Collection $accountsCache = null;
              private ?Collection $reservesCache = null;
              private ?Collection $investmentsCache = null;
              private ?Collection $patrimonyCache = null;

              public function __construct(int $workspaceId)
              {
                  $this->workspaceId = $workspaceId;
              }
          """
          if old not in s:
              raise SystemExit('class header not found')
          s = s.replace(old, new, 1)

          old = """    public function getAccounts(): Collection
              {
                  return BankAccount::where('workspace_id', $this->workspaceId)
                      ->orderBy('is_business')
                      ->orderBy('name')
                      ->get();
              }
          """
          new = """    public function getAccounts(): Collection
              {
                  if ($this->accountsCache !== null) {
                      return $this->accountsCache;
                  }

                  return $this->accountsCache = BankAccount::where('workspace_id', $this->workspaceId)
                      ->withSum('incomes as current_balance_income_total', 'amount')
                      ->withSum('expenses as current_balance_expense_total', 'amount')
                      ->withSum([
                          'recurringIncomes as current_balance_recurring_due' => fn ($query) => $query
                              ->where('is_active', true)
                              ->where('day_of_month', '<=', now()->day),
                      ], 'amount')
                      ->orderBy('is_business')
                      ->orderBy('name')
                      ->get();
              }
          """
          if old not in s:
              raise SystemExit('getAccounts block not found')
          s = s.replace(old, new, 1)

          old = """    public function getReserves(): Collection
              {
                  return BankReserve::where('workspace_id', $this->workspaceId)
                      ->orderBy('name')
                      ->get();
              }
          """
          new = """    public function getReserves(): Collection
              {
                  if ($this->reservesCache !== null) {
                      return $this->reservesCache;
                  }

                  return $this->reservesCache = BankReserve::where('workspace_id', $this->workspaceId)
                      ->orderBy('name')
                      ->get();
              }
          """
          if old not in s:
              raise SystemExit('getReserves block not found')
          s = s.replace(old, new, 1)

          old = """    public function getInvestments(): Collection
              {
                  return Investment::where('workspace_id', $this->workspaceId)->get();
              }
          """
          new = """    public function getInvestments(): Collection
              {
                  if ($this->investmentsCache !== null) {
                      return $this->investmentsCache;
                  }

                  return $this->investmentsCache = Investment::where('workspace_id', $this->workspaceId)->get();
              }
          """
          if old not in s:
              raise SystemExit('getInvestments block not found')
          s = s.replace(old, new, 1)

          old = """    public function getPatrimony(): Collection
              {
                  return BankPatrimony::where('workspace_id', $this->workspaceId)
                      ->where('status', '!=', 'sold')
                      ->orderBy('type')
                      ->get();
              }
          """
          new = """    public function getPatrimony(): Collection
              {
                  if ($this->patrimonyCache !== null) {
                      return $this->patrimonyCache;
                  }

                  return $this->patrimonyCache = BankPatrimony::where('workspace_id', $this->workspaceId)
                      ->where('status', '!=', 'sold')
                      ->orderBy('type')
                      ->get();
              }
          """
          if old not in s:
              raise SystemExit('getPatrimony block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit optimization and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/optimize-banco-service.yml
          git add app/Services/BancoService.php .github/workflows/optimize-banco-service.yml
          git diff --cached --quiet && exit 0
          git commit -m 'perf: reduce BancoService duplicate queries and bank balance N+1'
          git push
