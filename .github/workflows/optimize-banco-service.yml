name: Optimize BancoService

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize BancoService query patterns v2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Services/BancoService.php')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "    private ?Collection $patrimonyCache = null;\n",
              "    private ?Collection $patrimonyCache = null;\n\n    private ?float $fixedMonthlyIncomeCache = null;\n"
          )

          old_flow = '''    public function getMonthlyFlow(int $months = 12): array
    {
        $data = [];
        $fixedIncome = $this->getFixedMonthlyIncome();

        for ($i = $months - 1; $i >= 0; $i--) {
            $date = now()->subMonths($i);
            $month = $date->format('Y-m');
            $label = $date->locale('pt')->isoFormat('MMM YY');

            $income = Income::where('workspace_id', $this->workspaceId)
                ->whereYear('received_at', $date->year)
                ->whereMonth('received_at', $date->month)
                ->sum('amount');

            $expense = Expense::where('workspace_id', $this->workspaceId)
                ->whereYear('spent_at', $date->year)
                ->whereMonth('spent_at', $date->month)
                ->sum('amount');

            $data[] = [
                'month' => $month,
                'label' => $label,
                'income' => (float) $income + $fixedIncome,
                'expense' => (float) $expense,
                'balance' => (float) ($income + $fixedIncome - $expense),
            ];
        }

        return $data;
    }
'''

          new_flow = '''    public function getMonthlyFlow(int $months = 12): array
    {
        $fixedIncome = $this->getFixedMonthlyIncome();
        $start = now()->startOfMonth()->subMonths($months - 1);
        $end = now()->endOfMonth();

        $incomeByMonth = Income::where('workspace_id', $this->workspaceId)
            ->whereBetween('received_at', [$start, $end])
            ->selectRaw("DATE_FORMAT(received_at, '%Y-%m') as month, SUM(amount) as total")
            ->groupBy('month')
            ->pluck('total', 'month');

        $expenseByMonth = Expense::where('workspace_id', $this->workspaceId)
            ->whereBetween('spent_at', [$start, $end])
            ->selectRaw("DATE_FORMAT(spent_at, '%Y-%m') as month, SUM(amount) as total")
            ->groupBy('month')
            ->pluck('total', 'month');

        $data = [];
        for ($i = $months - 1; $i >= 0; $i--) {
            $date = now()->startOfMonth()->subMonths($i);
            $month = $date->format('Y-m');
            $income = (float) ($incomeByMonth[$month] ?? 0);
            $expense = (float) ($expenseByMonth[$month] ?? 0);

            $data[] = [
                'month' => $month,
                'label' => $date->locale('pt')->isoFormat('MMM YY'),
                'income' => $income + $fixedIncome,
                'expense' => $expense,
                'balance' => $income + $fixedIncome - $expense,
            ];
        }

        return $data;
    }
'''
          if old_flow not in text:
              raise SystemExit('getMonthlyFlow target not found')
          text = text.replace(old_flow, new_flow)

          old_stats = '''        $allIncomes = Income::where('workspace_id', $this->workspaceId)->pluck('amount');
        $allExpenses = Expense::where('workspace_id', $this->workspaceId)->pluck('amount');

        $maxIncome = $allIncomes->max() ?? 0;
        $maxExpense = $allExpenses->max() ?? 0;
        $totalMoved = $allIncomes->sum() + $allExpenses->sum();
'''
          new_stats = '''        $incomeStats = Income::where('workspace_id', $this->workspaceId)
            ->selectRaw('MAX(amount) as max_amount, SUM(amount) as total_amount')
            ->first();
        $expenseStats = Expense::where('workspace_id', $this->workspaceId)
            ->selectRaw('MAX(amount) as max_amount, SUM(amount) as total_amount')
            ->first();

        $maxIncome = (float) ($incomeStats->max_amount ?? 0);
        $maxExpense = (float) ($expenseStats->max_amount ?? 0);
        $totalMoved = (float) ($incomeStats->total_amount ?? 0) + (float) ($expenseStats->total_amount ?? 0);
'''
          if old_stats not in text:
              raise SystemExit('getStats target not found')
          text = text.replace(old_stats, new_stats)

          old_fixed = '''    private function getFixedMonthlyIncome(): float
    {
        return (float) RecurringIncome::where('workspace_id', $this->workspaceId)
            ->where('is_active', true)
            ->get()
            ->sum(fn ($r) => match ($r->frequency) {
                'semanal' => (float) $r->amount * 52 / 12,
                'anual' => (float) $r->amount / 12,
                default => (float) $r->amount,
            });
    }
'''
          new_fixed = '''    private function getFixedMonthlyIncome(): float
    {
        if ($this->fixedMonthlyIncomeCache !== null) {
            return $this->fixedMonthlyIncomeCache;
        }

        return $this->fixedMonthlyIncomeCache = (float) RecurringIncome::where('workspace_id', $this->workspaceId)
            ->where('is_active', true)
            ->get()
            ->sum(fn ($r) => match ($r->frequency) {
                'semanal' => (float) $r->amount * 52 / 12,
                'anual' => (float) $r->amount / 12,
                default => (float) $r->amount,
            });
    }
'''
          if old_fixed not in text:
              raise SystemExit('getFixedMonthlyIncome target not found')
          text = text.replace(old_fixed, new_fixed)

          old_avg = '''    private function getAvgMonthlyExpense(int $months = 6): float
    {
        $total = 0;
        for ($i = 1; $i <= $months; $i++) {
            $date = now()->subMonths($i);
            $total += (float) Expense::where('workspace_id', $this->workspaceId)
                ->whereYear('spent_at', $date->year)
                ->whereMonth('spent_at', $date->month)
                ->sum('amount');
        }

        return $months > 0 ? $total / $months : 0;
    }
'''
          new_avg = '''    private function getAvgMonthlyExpense(int $months = 6): float
    {
        if ($months <= 0) {
            return 0;
        }

        $start = now()->startOfMonth()->subMonths($months);
        $end = now()->startOfMonth()->subSecond();

        $total = (float) Expense::where('workspace_id', $this->workspaceId)
            ->whereBetween('spent_at', [$start, $end])
            ->sum('amount');

        return $total / $months;
    }
'''
          if old_avg not in text:
              raise SystemExit('getAvgMonthlyExpense target not found')
          text = text.replace(old_avg, new_avg)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP syntax
        run: php -l app/Services/BancoService.php

      - name: Commit optimization and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/BancoService.php .github/workflows/optimize-banco-service.yml
          git commit -m "Optimize BancoService database aggregations" || exit 0
          git rm .github/workflows/optimize-banco-service.yml
          git commit -m "Remove one-time BancoService optimization workflow"
          git push
