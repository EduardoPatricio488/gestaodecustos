name: modal-complete-audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit every modal implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MODAL IMPLEMENTATIONS ==='
          git grep -n -E 'role="dialog"|<dialog|x-show=.*modal|x-data=.*show|open-modal|close-modal|fixed inset-0' -- 'resources/views' 'resources/js' || true
          echo '=== CLOSE CONTROLS ==='
          git grep -n -E 'aria-label="(Fechar|Close)|>Fechar<|>Cancelar<|>Cancel<' -- 'resources/views' 'resources/js' || true

      - name: Fix global modal behaviour
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('resources/js/app.js')
          text = path.read_text(encoding='utf-8')
          old = re.compile(r'''\(function \(\) \{\n    const closeModal = \(button\) => \{.*?\n\}\)\(\);''', re.S)
          replacement = r'''(function () {
    const getDialog = (button) => button?.closest('[role="dialog"], dialog, [data-modal], [x-data*="show:"]');
    const closeModal = (button) => {
        const dialog = getDialog(button);
        if (!dialog) return false;
        const modalName = dialog.getAttribute('data-modal') || dialog.getAttribute('data-name') || dialog.getAttribute('data-modal-name') || dialog.id || '';
        if (modalName) {
            window.dispatchEvent(new CustomEvent('close-modal', { detail: modalName }));
            window.dispatchEvent(new CustomEvent('modal-close', { detail: { name: modalName } }));
        }
        if (typeof dialog.close === 'function' && dialog.open) dialog.close();
        try {
            if (window.Alpine && dialog._x_dataStack?.length) {
                const data = Alpine.$data(dialog);
                if (typeof data?.show !== 'undefined') data.show = false;
            }
        } catch (_) {}
        return true;
    };
    document.addEventListener('click', (event) => {
        const button = event.target.closest('button, [role="button"]');
        if (!button || button.type === 'submit' || button.disabled) return;
        const dialog = getDialog(button);
        if (!dialog) return;
        const label = (button.getAttribute('aria-label') || button.getAttribute('title') || '').replace(/\s+/g, ' ').trim().toLowerCase();
        const iconOnly = !button.textContent?.trim() && !!button.querySelector('svg');
        const explicitClose = /^(fechar|close|close modal|dismiss|discard|descartar)$/.test(label);
        if (!explicitClose && !iconOnly) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        closeModal(button);
    }, true);
})();'''
          if old.search(text):
              text = old.sub(replacement, text, count=1)
          marker = '// Finance Pro AI — universal modal normalizer'
          if marker not in text:
              text += r'''

// Finance Pro AI — universal modal normalizer
(function () {
    const CLOSE_LABEL = 'Fechar modal';
    const CLOSE_TITLE = 'Fechar';
    const CLOSE_MARKER = 'data-finance-pro-modal-close';
    const MODAL_SELECTOR = '[role="dialog"], dialog, [data-modal], [x-data*="show:"]';
    const normalize = (value) => String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const isCloseControl = (button) => {
        if (!(button instanceof HTMLElement)) return false;
        if (button.hasAttribute(CLOSE_MARKER)) return true;
        const aria = normalize(button.getAttribute('aria-label'));
        const title = normalize(button.getAttribute('title'));
        const text = normalize(button.textContent);
        const iconOnly = !text && !!button.querySelector('svg');
        return /^(fechar|close|close modal|dismiss)$/.test(aria) || /^(fechar|close|close modal|dismiss)$/.test(title) || text === '×' || text === 'x' || (iconOnly && button.dataset.modalClose === 'true');
    };
    const close = (dialog) => {
        if (!dialog) return;
        const name = dialog.getAttribute('data-modal') || dialog.getAttribute('data-name') || dialog.getAttribute('data-modal-name') || dialog.id || '';
        if (name) {
            window.dispatchEvent(new CustomEvent('close-modal', { detail: name }));
            window.dispatchEvent(new CustomEvent('modal-close', { detail: { name } }));
        }
        if (typeof dialog.close === 'function' && dialog.open) dialog.close();
        try {
            if (window.Alpine && dialog._x_dataStack?.length) {
                const data = Alpine.$data(dialog);
                if (typeof data?.show !== 'undefined') data.show = false;
            }
        } catch (_) {}
        const existing = dialog.querySelector('[data-modal-close-action]');
        if (existing && existing !== document.activeElement) existing.click();
    };
    const ensureCloseButton = (dialog) => {
        if (!(dialog instanceof HTMLElement) || !dialog.matches(MODAL_SELECTOR) || !document.body.contains(dialog)) return;
        const visible = dialog.offsetParent !== null || dialog.hasAttribute('open');
        if (!visible) return;
        const candidates = Array.from(dialog.querySelectorAll('button, [role="button"]')).filter(isCloseControl);
        let canonical = candidates.find((button) => button.hasAttribute(CLOSE_MARKER)) || candidates[0] || null;
        candidates.forEach((button) => {
            if (button === canonical) return;
            button.setAttribute('aria-hidden', 'true');
            button.setAttribute('tabindex', '-1');
            button.style.display = 'none';
        });
        if (!canonical) {
            canonical = document.createElement('button');
            canonical.type = 'button';
            canonical.setAttribute('aria-label', CLOSE_LABEL);
            canonical.setAttribute('title', CLOSE_TITLE);
            canonical.setAttribute(CLOSE_MARKER, '1');
            canonical.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/></svg>';
            dialog.appendChild(canonical);
        }
        canonical.setAttribute(CLOSE_MARKER, '1');
        canonical.setAttribute('aria-label', CLOSE_LABEL);
        canonical.setAttribute('title', CLOSE_TITLE);
        canonical.classList.add('absolute', 'left-4', 'top-4', 'z-[100]', 'inline-flex', 'h-9', 'w-9', 'items-center', 'justify-center', 'rounded-full', 'bg-zinc-100', 'text-zinc-700', 'shadow-sm', 'hover:bg-zinc-200', 'dark:bg-zinc-800', 'dark:text-zinc-200');
        canonical.style.left = '1rem'; canonical.style.top = '1rem'; canonical.style.position = 'absolute'; canonical.style.zIndex = '100';
        if (!canonical.dataset.modalCloseBound) {
            canonical.dataset.modalCloseBound = '1';
            canonical.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); close(dialog); });
        }
    };
    const scan = () => document.querySelectorAll(MODAL_SELECTOR).forEach(ensureCloseButton);
    const observer = new MutationObserver(scan);
    const start = () => { scan(); if (document.body) observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style', 'open', 'x-show'] }); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true }); else start();
    document.addEventListener('livewire:navigated', () => setTimeout(scan, 50));
    document.addEventListener('livewire:initialized', () => setTimeout(scan, 50));
    document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        const dialogs = Array.from(document.querySelectorAll(MODAL_SELECTOR)).filter((dialog) => dialog.offsetParent !== null || dialog.hasAttribute('open'));
        if (dialogs.length) close(dialogs[dialogs.length - 1]);
    }, true);
})();
'''
              path.write_text(text, encoding='utf-8')
