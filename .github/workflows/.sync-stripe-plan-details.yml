name: Sync Stripe plan details modal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add live Stripe data to plan modal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('resources/views/livewire/subscription-hub.blade.php')
          text = path.read_text(encoding='utf-8')

          marker = "    {{-- MODAL: INFORMAÇÃO DO PLANO FINANCE PRO --}}"
          if marker not in text:
              raise SystemExit('Platform plan modal marker not found.')

          stripe_block = r'''\n        @php\n            $stripeCustomer = null;\n            $stripeSubscription = null;\n            $stripePaymentMethod = null;\n            $stripeInvoices = [];\n            $stripeError = null;\n\n            try {\n                $stripeSecret = env('STRIPE_SECRET');\n                $stripeCustomerId = auth()->user()?->stripe_id;\n\n                if ($stripeSecret && $stripeCustomerId) {\n                    $stripe = new \\Stripe\\StripeClient($stripeSecret);\n                    $stripeCustomer = $stripe->customers->retrieve($stripeCustomerId, []);\n\n                    $subscriptionId = $platformCashierSubscription?->stripe_id;\n                    if ($subscriptionId) {\n                        $stripeSubscription = $stripe->subscriptions->retrieve($subscriptionId, [\n                            'expand' => ['default_payment_method', 'latest_invoice'],\n                        ]);\n                    }\n\n                    $paymentMethodId = null;\n                    if ($stripeSubscription?->default_payment_method) {\n                        $paymentMethodId = is_string($stripeSubscription->default_payment_method)\n                            ? $stripeSubscription->default_payment_method\n                            : $stripeSubscription->default_payment_method->id;\n                    } elseif ($stripeCustomer->invoice_settings?->default_payment_method) {\n                        $paymentMethodId = is_string($stripeCustomer->invoice_settings->default_payment_method)\n                            ? $stripeCustomer->invoice_settings->default_payment_method\n                            : $stripeCustomer->invoice_settings->default_payment_method->id;\n                    }\n\n                    if ($paymentMethodId) {\n                        $stripePaymentMethod = is_object($stripeSubscription?->default_payment_method)\n                            ? $stripeSubscription->default_payment_method\n                            : $stripe->paymentMethods->retrieve($paymentMethodId, []);\n                    }\n\n                    $stripeInvoices = $stripe->invoices->all([\n                        'customer' => $stripeCustomerId,\n                        'limit' => 100,\n                    ])->data ?? [];\n                }\n            } catch (\\Throwable $e) {\n                $stripeError = 'Não foi possível carregar os dados do Stripe neste momento.';\n                report($e);\n            }\n        @endphp\n'''

          if '$stripeCustomer = null;' not in text:
              target = marker + '\n    @if($showPlatformPlanModal)'
              replacement = marker + '\n    @if($showPlatformPlanModal)' + stripe_block
              text = text.replace(target, replacement, 1)

          details = r'''\n                        <div class="rounded-2xl border border-indigo-200 dark:border-indigo-900/50 bg-indigo-50/70 dark:bg-indigo-950/20 p-5 space-y-5">\n                            <div class="flex items-center justify-between gap-3">\n                                <div>\n                                    <p class="text-[9px] font-black uppercase tracking-[0.3em] text-indigo-600 dark:text-indigo-300">Stripe • dados reais</p>\n                                    <h4 class="mt-1 text-sm font-black uppercase tracking-widest dark:text-white">Dados do cliente e faturação</h4>\n                                </div>\n                                @if($stripeCustomer?->id)\n                                    <span class="text-[10px] font-mono font-bold text-zinc-500 break-all">{{ $stripeCustomer->id }}</span>\n                                @endif\n                            </div>\n\n                            @if($stripeError)\n                                <p class="text-xs font-bold text-amber-700 dark:text-amber-300">{{ $stripeError }}</p>\n                            @elseif($stripeCustomer)\n                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">\n                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Nome</p><p class="mt-1 text-sm font-bold dark:text-white">{{ $stripeCustomer->name ?: '—' }}</p></div>\n                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Email</p><p class="mt-1 text-sm font-bold break-all dark:text-white">{{ $stripeCustomer->email ?: '—' }}</p></div>\n                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Telefone</p><p class="mt-1 text-sm font-bold dark:text-white">{{ $stripeCustomer->phone ?: '—' }}</p></div>\n                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Moeda</p><p class="mt-1 text-sm font-bold uppercase dark:text-white">{{ $stripeCustomer->currency ?: '—' }}</p></div>\n                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4 sm:col-span-2"><p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Descrição</p><p class="mt-1 text-sm font-bold dark:text-white">{{ $stripeCustomer->description ?: '—' }}</p></div>\n                                </div>\n\n                                @if($stripeCustomer->address)\n                                    <div>\n                                        <p class="mb-2 text-[9px] font-black uppercase tracking-widest text-zinc-500">Morada de faturação</p>\n                                        <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4 text-sm font-bold dark:text-white">\n                                            {{ $stripeCustomer->address->line1 ?: '' }}{{ $stripeCustomer->address->line2 ? ', '.$stripeCustomer->address->line2 : '' }}<br>\n                                            {{ $stripeCustomer->address->postal_code ?: '' }} {{ $stripeCustomer->address->city ?: '' }}<br>\n                                            {{ $stripeCustomer->address->state ?: '' }}{{ $stripeCustomer->address->country ? ' • '.$stripeCustomer->address->country : '' }}\n                                        </div>\n                                    </div>\n                                @endif\n\n                                @if($stripePaymentMethod)\n                                    <div>\n                                        <p class="mb-2 text-[9px] font-black uppercase tracking-widest text-zinc-500">Método de pagamento</p>\n                                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">\n                                            <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Tipo</p><p class="mt-1 text-sm font-black uppercase dark:text-white">{{ $stripePaymentMethod->type ?: '—' }}</p></div>\n                                            @if($stripePaymentMethod->card)\n                                                <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Cartão</p><p class="mt-1 text-sm font-black uppercase dark:text-white">{{ $stripePaymentMethod->card->brand }} •••• {{ $stripePaymentMethod->card->last4 }}</p></div>\n                                                <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Validade</p><p class="mt-1 text-sm font-black dark:text-white">{{ str_pad($stripePaymentMethod->card->exp_month, 2, '0', STR_PAD_LEFT) }}/{{ $stripePaymentMethod->card->exp_year }}</p></div>\n                                            @endif\n                                            <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Titular</p><p class="mt-1 text-sm font-black dark:text-white">{{ $stripePaymentMethod->billing_details->name ?: '—' }}</p></div>\n                                        </div>\n                                    </div>\n                                @endif\n\n                                @if($stripeSubscription)\n                                    <div>\n                                        <p class="mb-2 text-[9px] font-black uppercase tracking-widest text-zinc-500">Subscrição Stripe</p>\n                                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">\n                                            <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">ID</p><p class="mt-1 text-xs font-mono font-bold break-all dark:text-white">{{ $stripeSubscription->id }}</p></div>\n                                            <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Estado</p><p class="mt-1 text-sm font-black uppercase dark:text-white">{{ $stripeSubscription->status }}</p></div>\n                                            <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Renovação</p><p class="mt-1 text-sm font-black dark:text-white">{{ $stripeSubscription->current_period_end ? \Carbon\Carbon::createFromTimestamp($stripeSubscription->current_period_end)->format('d/m/Y H:i') : '—' }}</p></div>\n                                        </div>\n                                    </div>\n                                @endif\n\n                                @if(!empty($stripeInvoices))\n                                    <div>\n                                        <div class="flex items-center justify-between mb-2"><p class="text-[9px] font-black uppercase tracking-widest text-zinc-500">Invoices Stripe</p><span class="text-[10px] font-bold text-zinc-500">{{ count($stripeInvoices) }} registo(s)</span></div>\n                                        <div class="space-y-2 max-h-64 overflow-y-auto">\n                                            @foreach($stripeInvoices as $invoice)\n                                                <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4">\n                                                    <div><p class="text-[9px] font-black uppercase text-zinc-500">Invoice</p><p class="text-xs font-mono font-bold break-all dark:text-white">{{ $invoice->number ?: $invoice->id }}</p></div>\n                                                    <div><p class="text-[9px] font-black uppercase text-zinc-500">Valor</p><p class="text-xs font-bold dark:text-white">{{ number_format(($invoice->amount_paid ?? $invoice->amount_due ?? 0) / 100, 2, ',', ' ') }} {{ strtoupper($invoice->currency ?? 'EUR') }}</p></div>\n                                                    <div><p class="text-[9px] font-black uppercase text-zinc-500">Estado</p><p class="text-xs font-bold uppercase dark:text-white">{{ $invoice->status ?: '—' }}</p></div>\n                                                    <div><p class="text-[9px] font-black uppercase text-zinc-500">Data</p><p class="text-xs font-bold dark:text-white">{{ $invoice->created ? \Carbon\Carbon::createFromTimestamp($invoice->created)->format('d/m/Y H:i') : '—' }}</p></div>\n                                                    <div class="flex items-end sm:justify-end">@if($invoice->hosted_invoice_url)<a href="{{ $invoice->hosted_invoice_url }}" target="_blank" rel="noopener" class="text-[10px] font-black uppercase tracking-widest text-brand-600 hover:underline">Abrir invoice</a>@endif</div>\n                                                </div>\n                                            @endforeach\n                                        </div>\n                                    </div>\n                                @endif\n                            @else\n                                <p class="text-xs font-bold text-zinc-500">Este utilizador ainda não tem um cliente Stripe associado.</p>\n                            @endif\n                        </div>\n'''

          anchor = "                        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">"
          pos = text.find(anchor, text.find(marker))
          if pos == -1:
              raise SystemExit('Platform plan details grid not found.')
          text = text[:pos] + details + text[pos:]

          path.write_text(text, encoding='utf-8')
          print('Stripe details added.')
          PY

      - name: Commit and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/subscription-hub.blade.php
          git rm -f .github/workflows/.sync-stripe-plan-details.yml
          git commit -m "feat: sync platform plan modal with Stripe details"
          git push origin main
