name: Sync Stripe plan details modal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add live Stripe data to plan modal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('resources/views/livewire/subscription-hub.blade.php')
          text = path.read_text(encoding='utf-8')
          modal = '    @if($showPlatformPlanModal)'
          if modal not in text:
              raise SystemExit('Platform plan modal not found.')

          stripe = r'''
        @php
            $stripeCustomer = null;
            $stripeSubscription = null;
            $stripePaymentMethod = null;
            $stripeInvoices = [];
            $stripeError = null;
            try {
                $secret = config('services.stripe.secret');
                $customerId = auth()->user()?->stripe_id;
                if ($secret && $customerId) {
                    $client = new \Stripe\StripeClient($secret);
                    $stripeCustomer = $client->customers->retrieve($customerId, []);
                    $subscriptionId = $platformCashierSubscription?->stripe_id;
                    if ($subscriptionId) {
                        $stripeSubscription = $client->subscriptions->retrieve($subscriptionId, ['expand' => ['default_payment_method']]);
                    }
                    $pm = $stripeSubscription?->default_payment_method ?? $stripeCustomer->invoice_settings?->default_payment_method;
                    $pmId = is_string($pm) ? $pm : ($pm?->id);
                    if ($pmId) {
                        $stripePaymentMethod = is_object($pm) ? $pm : $client->paymentMethods->retrieve($pmId, []);
                    }
                    $stripeInvoices = $client->invoices->all(['customer' => $customerId, 'limit' => 100])->data ?? [];
                }
            } catch (\Throwable $e) {
                report($e);
                $stripeError = 'Não foi possível carregar os dados do Stripe neste momento.';
            }
        @endphp
'''
          if '$stripeCustomer = null;' not in text:
              text = text.replace(modal, modal + stripe, 1)

          old = '''                        <div class="rounded-2xl border border-amber-200 dark:border-amber-900/50 bg-amber-50 dark:bg-amber-950/20 p-5">
                            <p class="text-xs font-bold text-amber-800 dark:text-amber-300">Dados bancários</p>
                            <p class="mt-1 text-xs text-amber-700 dark:text-amber-400">Não são mostrados números completos de cartões, contas bancárias ou outros dados financeiros sensíveis. O sistema apresenta apenas os dados de pagamento que estão efetivamente registados.</p>
                        </div>'''
          details = r'''                        <div class="rounded-2xl border border-indigo-200 dark:border-indigo-900/50 bg-indigo-50/70 dark:bg-indigo-950/20 p-5 space-y-5">
                            <div class="flex items-center justify-between gap-3">
                                <div><p class="text-[9px] font-black uppercase tracking-[0.3em] text-indigo-600 dark:text-indigo-300">Stripe • dados reais</p><h4 class="mt-1 text-sm font-black uppercase tracking-widest dark:text-white">Cliente, cartão, subscrição e pagamentos</h4></div>
                                @if($stripeCustomer?->id)<span class="text-[10px] font-mono text-zinc-500 break-all">{{ $stripeCustomer->id }}</span>@endif
                            </div>
                            @if($stripeError)
                                <p class="text-xs font-bold text-amber-700 dark:text-amber-300">{{ $stripeError }}</p>
                            @elseif($stripeCustomer)
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Nome</p><p class="mt-1 text-sm font-bold dark:text-white">{{ $stripeCustomer->name ?: '—' }}</p></div>
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Email</p><p class="mt-1 text-sm font-bold break-all dark:text-white">{{ $stripeCustomer->email ?: '—' }}</p></div>
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Customer ID</p><p class="mt-1 text-xs font-mono font-bold break-all dark:text-white">{{ $stripeCustomer->id }}</p></div>
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Moeda</p><p class="mt-1 text-sm font-bold uppercase dark:text-white">{{ $stripeCustomer->currency ?: '—' }}</p></div>
                                </div>
                                @if($stripeCustomer->address)
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Morada de faturação</p><p class="mt-1 text-sm font-bold dark:text-white">{{ $stripeCustomer->address->line1 ?: '' }}{{ $stripeCustomer->address->line2 ? ', '.$stripeCustomer->address->line2 : '' }}{{ $stripeCustomer->address->postal_code || $stripeCustomer->address->city ? ', '.$stripeCustomer->address->postal_code.' '.$stripeCustomer->address->city : '' }}{{ $stripeCustomer->address->country ? ', '.$stripeCustomer->address->country : '' }}</p></div>
                                @endif
                                @if($stripePaymentMethod)
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Método de pagamento</p><div class="mt-2 grid grid-cols-2 sm:grid-cols-4 gap-3"><div><p class="text-[9px] text-zinc-500">Tipo</p><p class="text-sm font-black uppercase dark:text-white">{{ $stripePaymentMethod->type ?: '—' }}</p></div>@if($stripePaymentMethod->card)<div><p class="text-[9px] text-zinc-500">Cartão</p><p class="text-sm font-black uppercase dark:text-white">{{ $stripePaymentMethod->card->brand }} •••• {{ $stripePaymentMethod->card->last4 }}</p></div><div><p class="text-[9px] text-zinc-500">Validade</p><p class="text-sm font-black dark:text-white">{{ str_pad($stripePaymentMethod->card->exp_month, 2, '0', STR_PAD_LEFT) }}/{{ $stripePaymentMethod->card->exp_year }}</p></div>@endif<div><p class="text-[9px] text-zinc-500">Titular</p><p class="text-sm font-black dark:text-white">{{ $stripePaymentMethod->billing_details->name ?: '—' }}</p></div></div></div>
                                @endif
                                @if($stripeSubscription)
                                    <div class="rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><p class="text-[9px] font-black uppercase text-zinc-500">Subscrição Stripe</p><div class="mt-2 grid grid-cols-1 sm:grid-cols-3 gap-3"><div><p class="text-[9px] text-zinc-500">Subscription ID</p><p class="text-xs font-mono font-bold break-all dark:text-white">{{ $stripeSubscription->id }}</p></div><div><p class="text-[9px] text-zinc-500">Estado</p><p class="text-sm font-black uppercase dark:text-white">{{ $stripeSubscription->status }}</p></div><div><p class="text-[9px] text-zinc-500">Renovação</p><p class="text-sm font-black dark:text-white">{{ $stripeSubscription->current_period_end ? \Carbon\Carbon::createFromTimestamp($stripeSubscription->current_period_end)->format('d/m/Y H:i') : '—' }}</p></div></div></div>
                                @endif
                                @if(!empty($stripeInvoices))
                                    <div><div class="flex items-center justify-between mb-2"><p class="text-[9px] font-black uppercase text-zinc-500">Histórico de invoices Stripe</p><span class="text-[10px] text-zinc-500">{{ count($stripeInvoices) }} invoice(s)</span></div><div class="space-y-2 max-h-80 overflow-y-auto">@foreach($stripeInvoices as $invoice)<div class="grid grid-cols-1 sm:grid-cols-6 gap-3 rounded-xl bg-white/80 dark:bg-zinc-900/60 p-4"><div><p class="text-[9px] text-zinc-500">Invoice</p><p class="text-xs font-mono font-bold break-all dark:text-white">{{ $invoice->number ?: $invoice->id }}</p></div><div><p class="text-[9px] text-zinc-500">ID</p><p class="text-xs font-mono font-bold break-all dark:text-white">{{ $invoice->id }}</p></div><div><p class="text-[9px] text-zinc-500">Valor</p><p class="text-xs font-bold dark:text-white">{{ number_format(($invoice->amount_paid ?? $invoice->amount_due ?? 0) / 100, 2, ',', ' ') }} {{ strtoupper($invoice->currency ?? 'EUR') }}</p></div><div><p class="text-[9px] text-zinc-500">Estado</p><p class="text-xs font-bold uppercase dark:text-white">{{ $invoice->status ?: '—' }}</p></div><div><p class="text-[9px] text-zinc-500">Data</p><p class="text-xs font-bold dark:text-white">{{ $invoice->created ? \Carbon\Carbon::createFromTimestamp($invoice->created)->format('d/m/Y H:i') : '—' }}</p></div><div class="flex items-end sm:justify-end">@if($invoice->hosted_invoice_url)<a href="{{ $invoice->hosted_invoice_url }}" target="_blank" rel="noopener" class="text-[10px] font-black uppercase text-brand-600 hover:underline">Abrir invoice</a>@endif</div></div>@endforeach</div></div>
                                @endif
                            @else
                                <p class="text-xs font-bold text-zinc-500">Este utilizador ainda não tem um cliente Stripe associado.</p>
                            @endif
                            <div class="rounded-xl border border-amber-200 dark:border-amber-900/50 bg-amber-50 dark:bg-amber-950/20 p-4"><p class="text-xs font-bold text-amber-800 dark:text-amber-300">Segurança</p><p class="mt-1 text-xs text-amber-700 dark:text-amber-400">O Stripe não disponibiliza à aplicação o número completo do cartão nem o CVC. Apenas marca, últimos 4 dígitos, validade e titular são apresentados.</p></div>
                        </div>'''
          if old in text:
              text = text.replace(old, details, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Fix nullable Cashier subscription variable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/Livewire/SubscriptionHub.php')
          t=p.read_text(encoding='utf-8')
          needle="        $platformEntry = null;\n\n        if ($platformPlan) {"
          repl="        $platformEntry = null;\n        $cashierSub = null;\n\n        if ($platformPlan) {"
          if needle in t and '$cashierSub = null;' not in t:
              t=t.replace(needle,repl,1)
              p.write_text(t,encoding='utf-8')
          PY

      - name: Validate
        run: |
          php -l app/Livewire/SubscriptionHub.php
          php -l resources/views/livewire/subscription-hub.blade.php

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/livewire/subscription-hub.blade.php app/Livewire/SubscriptionHub.php
          git commit -m "feat: show complete safe Stripe plan details" || exit 0
          git push origin main
