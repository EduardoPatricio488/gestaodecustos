name: One-time performance pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize Dashboard external calls and daily cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/Livewire/Dashboard.php')
          s = p.read_text()
          s = s.replace("return Cache::flexible(\n            \"dashboard:ai-insights:{$currentWs->id}:\".now()->format('Y-m'),\n            [120, 600],", "return Cache::flexible(\n            \"dashboard:ai-insights:{$currentWs->id}:\".now()->format('Y-m'),\n            [300, 1800],")
          s = s.replace("Http::get('https://query1.finance.yahoo.com/v7/finance/quote'", "Http::connectTimeout(1)->timeout(3)->get('https://query1.finance.yahoo.com/v7/finance/quote'")
          s = s.replace("Http::get('https://api.worldbank.org/", "Http::connectTimeout(1)->timeout(2)->get('https://api.worldbank.org/")
          s = s.replace("Http::get('https://api.exchangerate.host/", "Http::connectTimeout(1)->timeout(2)->get('https://api.exchangerate.host/")
          s = s.replace("Http::get('https://api.open-meteo.com/", "Http::connectTimeout(1)->timeout(2)->get('https://api.open-meteo.com/")
          old = '''        $expenses = Expense::where('workspace_id', $wsId)->whereBetween('spent_at', [$today, $endDay])->get();\n        $incomes = Income::where('workspace_id', $wsId)->whereBetween('received_at', [$today, $endDay])->get();\n        $fitness = FitnessActivity::where('workspace_id', $wsId)->where('user_id', $user->id)->whereBetween('activity_date', [$today, $endDay])->get();\n        $remindersDone = Reminder::where('workspace_id', $wsId)->where('is_completed', true)->whereBetween('updated_at', [$today, $endDay])->count();\n        $socialCount = SocialNotification::where('user_id', $user->id)->whereBetween('created_at', [$today, $endDay])->count();'''
          new = '''        $expenses = Expense::where('workspace_id', $wsId)->whereBetween('spent_at', [$today, $endDay])->get();\n        $incomes = Income::where('workspace_id', $wsId)->whereBetween('received_at', [$today, $endDay])->get();\n        $fitness = FitnessActivity::where('workspace_id', $wsId)->where('user_id', $user->id)->whereBetween('activity_date', [$today, $endDay])->get();\n        $remindersDone = Reminder::where('workspace_id', $wsId)->where('is_completed', true)->whereBetween('updated_at', [$today, $endDay])->count();\n        $socialCount = SocialNotification::where('user_id', $user->id)->whereBetween('created_at', [$today, $endDay])->count();'''
          # Keep the data shape intact; only cache the completed report for repeated Livewire renders.
          marker = "        $expenses = Expense::where('workspace_id', $wsId)"
          if "dashboard:daily-report:" not in s:
              start = s.find(marker, s.find('public function dailyReport'))
              if start != -1:
                  s = s[:start] + "        return Cache::remember(\n            \"dashboard:daily-report:{$wsId}:\".now()->toDateString().\":{$user->id}\",\n            60,\n            function () use ($user, $currentWs, $today, $endDay, $wsId) {\n" + s[start:]
                  end_marker = "        return [\n            'is_premium' => true"
                  pos = s.find(end_marker, start)
                  if pos != -1:
                      # Find the matching closing of the return array/function using the known tail.
                      tail = "        ];\n    }\n\n    public function render()"
                      tail_pos = s.find(tail, pos)
                      if tail_pos != -1:
                          s = s[:tail_pos] + "        ];\n            }\n        );\n    }\n\n    public function render()" + s[tail_pos + len(tail):]
          p.write_text(s)
          PY
          php -l app/Livewire/Dashboard.php
          git diff --check
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-time-performance-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php .github/workflows/one-time-performance-pass.yml
          git commit -m "Reduce dashboard external API latency and repeated renders"
          git push
