name: Highlight Business Dashboard

on:
  push:
    paths:
      - '.github/workflows/highlight-business-dashboard.yml'

permissions:
  contents: write

jobs:
  highlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Highlight Dashboard Business
        shell: python
        run: |
          from pathlib import Path
          p = Path('resources/views/components/layouts/app.blade.php')
          s = p.read_text(encoding='utf-8')
          old = '''        <flux:sidebar.item icon="chart-pie" :href="route('hub.business.dashboard')" :current="request()->routeIs('hub.business.dashboard')" wire:navigate.hover>\n            Dashboard Business\n        </flux:sidebar.item>'''
          new = '''        <flux:sidebar.item\n            icon="chart-pie"\n            :href="route('hub.business.dashboard')"\n            :current="request()->routeIs('hub.business.dashboard')"\n            wire:navigate.hover\n            class="!bg-brand-50 !text-brand-700 dark:!bg-brand-500/15 dark:!text-brand-300 !font-black !rounded-2xl !shadow-sm !border !border-brand-200/70 dark:!border-brand-500/20 !py-3 !px-3 hover:!bg-brand-100 dark:hover:!bg-brand-500/20 transition-all duration-200"\n        >\n            <span class="flex items-center gap-2.5">\n                <span class="flex size-8 items-center justify-center rounded-xl bg-brand-600 text-white shadow-md shadow-brand-600/20 dark:bg-brand-500">\n                    <flux:icon name="chart-pie" class="size-4" />\n                </span>\n                <span class="font-black tracking-tight">Dashboard Business</span>\n                <span class="ml-auto size-2 rounded-full bg-brand-500 shadow-[0_0_0_4px_rgba(59,130,246,0.10)]"></span>\n            </span>\n        </flux:sidebar.item>'''
          if old not in s:
              raise SystemExit('Target Dashboard Business sidebar block not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          git commit -m "Make Business Dashboard prominent in sidebar"
          git push

# trigger