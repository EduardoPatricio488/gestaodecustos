name: Remove first Business Dashboard icon

on:
  push:
    paths:
      - '.github/workflows/highlight-business-dashboard.yml'

permissions:
  contents: write

jobs:
  remove-first-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove first icon from Business Dashboard item
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('resources/views/components/layouts/app.blade.php')
          s = p.read_text(encoding='utf-8')

          pattern = r'(<flux:sidebar\.item\s+)icon="chart-pie"(\s+:href="\{\{ route\(\'hub\.business\.dashboard\'\) \}\}")'
          new_s, count = re.subn(pattern, r'\1\2', s, count=1)

          if count != 1:
              print('Business Dashboard first icon already removed.')
              raise SystemExit(0)

          p.write_text(new_s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/components/layouts/app.blade.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remove first Business Dashboard icon"
          git push

