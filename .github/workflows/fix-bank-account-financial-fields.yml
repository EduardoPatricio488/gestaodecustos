name: Fix bank account financial fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch BankAccountHub PHP
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/Livewire/Business/BankAccountHub.php')
          s = p.read_text(encoding='utf-8')

          marker = "    public function generateAuditCode()\n"
          methods = '''    public function updatedBalance($value): void
    {
        $this->balance = $this->formatMoneyInput($value);
    }

    public function updatedCreditLimit($value): void
    {
        $this->credit_limit = $this->formatMoneyInput($value);
    }

    public function updatedForecastBalance($value): void
    {
        $this->forecast_balance = $this->formatMoneyInput($value);
    }

    private function formatMoneyInput($value): string
    {
        $value = preg_replace('/[^0-9,.-]/', '', (string) $value);
        $value = str_replace('.', ',', $value);

        if (substr_count($value, ',') > 1) {
            $lastComma = strrpos($value, ',');
            $value = str_replace(',', '', substr($value, 0, $lastComma)) . substr($value, $lastComma);
        }

        if (str_contains($value, ',')) {
            [$integer, $decimal] = array_pad(explode(',', $value, 2), 2, '');
            $integer = preg_replace('/\\D/', '', $integer) ?: '0';
            $decimal = preg_replace('/\\D/', '', $decimal);
            $decimal = substr($decimal, 0, 2);
            $formattedInteger = number_format((int) $integer, 0, ',', ' ');
            return $formattedInteger . ',' . $decimal;
        }

        $digits = preg_replace('/\\D/', '', $value);
        return $digits === '' ? '' : number_format((int) $digits, 0, ',', ' ');
    }

'''
          if 'public function updatedBalance($value)' not in s:
              if marker not in s:
                  raise SystemExit('BankAccountHub insertion marker not found')
              s = s.replace(marker, methods + marker, 1)

          old = "                'balance' => $this->balance,\n                'credit_limit' => $this->credit_limit,\n                'forecast_balance' => $this->forecast_balance,\n                'risk_score' => $this->risk_score,"
          new = "                'balance' => $this->toMoneyValue($this->balance),\n                'credit_limit' => $this->toMoneyValue($this->credit_limit),\n                'forecast_balance' => $this->toMoneyValue($this->forecast_balance),\n                'risk_score' => $this->risk_score === null || $this->risk_score === '' ? 0 : (int) $this->risk_score,"
          if old in s:
              s = s.replace(old, new, 1)

          marker2 = "    private function formatMoneyInput($value): string\n"
          helper = '''    private function toMoneyValue($value): ?float
    {
        if ($value === null || trim((string) $value) === '') {
            return null;
        }

        $normalized = str_replace(' ', '', (string) $value);
        $normalized = str_replace(',', '.', $normalized);

        return is_numeric($normalized) ? (float) $normalized : null;
    }

'''
          if 'private function toMoneyValue($value)' not in s:
              s = s.replace(marker2, helper + marker2, 1)

          p.write_text(s, encoding='utf-8')

      - name: Patch financial inputs
        shell: python
        run: |
          from pathlib import Path
          p = Path('resources/views/livewire/business/bank-account-hub.blade.php')
          s = p.read_text(encoding='utf-8')

          replacements = [
          ('''<flux:input
                                wire:model="balance"
                                type="number"
                                step="0.01"
                                class="font-black text-lg text-brand-600 !bg-white dark:!bg-zinc-950 !border-none rounded-xl h-12 shadow-sm"
                                placeholder="0,00"
                            />''', '''<flux:input
                                wire:model.live="balance"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                class="font-black text-lg text-brand-600 !bg-white dark:!bg-zinc-950 !border-none rounded-xl h-12 shadow-sm"
                                placeholder="0,00"
                            />'''),
          ('''<flux:input
                                wire:model="credit_limit"
                                type="number"
                                step="0.01"
                                class="font-black text-sm !bg-white dark:!bg-zinc-950 !border-none rounded-xl h-12 shadow-sm"
                                placeholder="Ex: 5000,00"
                            />''', '''<flux:input
                                wire:model.live="credit_limit"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                class="font-black text-sm !bg-white dark:!bg-zinc-950 !border-none rounded-xl h-12 shadow-sm"
                                placeholder="Ex: 5 000,00"
                            />'''),
          ('''<flux:input
                                wire:model="forecast_balance"
                                type="number"
                                step="0.01"
                                class="font-black text-sm !bg-white dark:!bg-zinc-950 !border-none rounded-xl h-12 shadow-sm"
                                placeholder="Ex: 12000,00"
                            />''', '''<flux:input
                                wire:model.live="forecast_balance"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                class="font-black text-sm !bg-white dark:!bg-zinc-950 !border-none rounded-xl h-12 shadow-sm"
                                placeholder="Ex: 12 000,00"
                            />''')]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Business/BankAccountHub.php resources/views/livewire/business/bank-account-hub.blade.php
          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "Fix bank account financial input formatting and risk score"
            git push
          fi
          git rm .github/workflows/fix-bank-account-financial-fields.yml
          git commit -m "Remove temporary bank account fix workflow"
          git push
