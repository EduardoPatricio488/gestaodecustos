name: Finalize external portal UI
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/enhance-external-portals.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('resources/views/livewire/business/client-hub.blade.php'); s=p.read_text()
          s=s.replace('name="client-modal" position="center" class="md:w-[650px] !p-0 overflow-visible"','name="client-modal" position="center" class="w-[calc(100vw-2rem)] md:w-[650px] !p-0 !max-h-[90vh] overflow-hidden"',1)
          s=s.replace('<div class="relative p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-10 shadow-2xl border border-zinc-200 dark:border-zinc-800">','<div class="relative max-h-[90vh] overflow-y-auto overscroll-contain p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-10 shadow-2xl border border-zinc-200 dark:border-zinc-800">',1)
          p.write_text(s)
          p=Path('resources/views/livewire/business/supplier-hub.blade.php'); s=p.read_text()
          s=s.replace('name="supplier-modal" position="center" class="md:w-[650px] !p-0 overflow-visible"','name="supplier-modal" position="center" class="w-[calc(100vw-2rem)] max-w-[650px] max-h-[90vh] !p-0 overflow-hidden"',1)
          s=s.replace('<div class="relative p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-10 shadow-2xl border border-zinc-200 dark:border-zinc-800">','<div class="relative max-h-[90vh] overflow-y-auto overscroll-contain p-10 bg-white dark:bg-zinc-950 rounded-[2.5rem] space-y-10 shadow-2xl border border-zinc-200 dark:border-zinc-800">',1)
          p.write_text(s)
          p=Path('resources/views/welcome.blade.php'); s=p.read_text()
          old='<a href="/login" wire:navigate class="rounded-lg px-4 py-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800">'
          new='<a href="/login" wire:navigate class="inline-flex items-center justify-center rounded-xl bg-zinc-950 dark:bg-white px-5 py-2.5 text-sm font-black text-white dark:text-zinc-950 shadow-lg shadow-zinc-950/15 hover:scale-[1.02] transition-all">'
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/views/livewire/business/client-hub.blade.php resources/views/livewire/business/supplier-hub.blade.php resources/views/welcome.blade.php
          git commit -m "Polish external modals and landing login" || exit 0
          git push
