name: Fix dashboard crypto prices

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-crypto-prices.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix crypto market data
        shell: python
        run: |
          from pathlib import Path

          php = Path('app/Livewire/Dashboard.php')
          s = php.read_text(encoding='utf-8')
          old = "Cache::remember('market_prices_all', 300, function () {"
          new = "Cache::remember('market_prices_all', 60, function () {"
          if old not in s:
              raise SystemExit('Dashboard cache block not found.')
          s = s.replace(old, new, 1)
          old = "Http::connectTimeout(1)->timeout(2)->get('https://api.coingecko.com/api/v3/simple/price'"
          new = "Http::connectTimeout(3)->timeout(6)->get('https://api.coingecko.com/api/v3/simple/price'"
          if old not in s:
              raise SystemExit('CoinGecko HTTP block not found.')
          s = s.replace(old, new, 1)
          old = "'MATIC' => 'matic-network', 'UNI' => 'uniswap',"
          new = "'MATIC' => 'polygon-ecosystem-token', 'UNI' => 'uniswap',"
          if old not in s:
              raise SystemExit('Crypto ID mapping not found.')
          s = s.replace(old, new, 1)
          php.write_text(s, encoding='utf-8')

          blade = Path('resources/views/livewire/dashboard.blade.php')
          s = blade.read_text(encoding='utf-8')
          old = """        foreach ($marketPrices as $symbol => $data) {\n            $tickers[$symbol] = $data;\n        }"""
          new = """        foreach ($marketPrices as $symbol => $data) {\n            $tickers[$symbol] = $data;\n        }\n\n        // Nunca apresentar preços de crypto antigos/fictícios quando a API não respondeu.\n        // As cryptos devem vir exclusivamente dos dados atuais da CoinGecko.\n        foreach (['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX', 'DOT', 'LINK', 'DOGE', 'MATIC', 'UNI'] as $cryptoSymbol) {\n            if (! isset($marketPrices[$cryptoSymbol])) {\n                unset($tickers[$cryptoSymbol]);\n            }\n        }"""
          if old not in s:
              raise SystemExit('Dashboard ticker merge block not found.')
          s = s.replace(old, new, 1)
          blade.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Livewire/Dashboard.php resources/views/livewire/dashboard.blade.php
          git commit -m "Fix dashboard crypto prices"
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/fix-dashboard-crypto-prices.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary crypto price workflow" || true
          git push || true
